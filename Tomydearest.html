<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd1e3">
<title>For You ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Long+Cang&display=swap" rel="stylesheet">
<style>
  :root{
    --pink1:#ffeaf4; --pink2:#ffd1e3; --pink3:#f7b8d4; --rose:#ff3d77;
    --ink:#7a2f45; --ink2:#9a4f68;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(120% 80% at 50% -10%, #fff6fb 0%, rgba(255,246,251,0) 60%),
      linear-gradient(160deg, var(--pink1) 0%, var(--pink2) 42%, var(--pink3) 100%);
    background-attachment:fixed;
    font-family:"Ma Shan Zheng","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
  }
  .aurora{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(255,150,200,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(200,150,255,0.12) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 50%, rgba(255,200,220,0.1) 0%, transparent 55%),
      radial-gradient(ellipse at 10% 80%, rgba(150,200,255,0.08) 0%, transparent 40%),
      radial-gradient(ellipse at 90% 20%, rgba(255,200,180,0.1) 0%, transparent 45%);
    animation:auroraMove 25s ease-in-out infinite;
  }
  @keyframes auroraMove{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    25%{ transform:translate(3%,-2%) rotate(1deg); }
    50%{ transform:translate(-2%,3%) rotate(-1deg); }
    75%{ transform:translate(-3%,-2%) rotate(1deg); }
  }
  .aurora2{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse at 40% 60%, rgba(255,100,150,0.08) 0%, transparent 40%),
      radial-gradient(ellipse at 60% 40%, rgba(180,100,255,0.06) 0%, transparent 35%),
      radial-gradient(ellipse at 30% 80%, rgba(100,200,255,0.05) 0%, transparent 30%);
    animation:auroraMove2 30s ease-in-out infinite;
  }
  @keyframes auroraMove2{
    0%,100%{ transform:translate(0,0); opacity:0.6; }
    50%{ transform:translate(-4%,4%); opacity:0.9; }
  }

  .layer{ position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  #petals{ z-index:1; }
  #butterflies{ z-index:2; }
  #burst{ z-index:6; }

  .petal{
    position:absolute; top:-8vh; color:#ff8fb1; opacity:0;
    text-shadow:0 0 6px rgba(255,120,170,.4);
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{ transform:translateY(-8vh) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:var(--op,.7); }
    92%{ opacity:var(--op,.7); }
    100%{ transform:translateY(108vh) translateX(var(--drift,30px)) rotate(360deg); opacity:0; }
  }
  .spark{
    position:absolute; color:#fff; opacity:0;
    animation:twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0; transform:scale(.5); }
    50%{ opacity:.9; transform:scale(1); }
  }
  .bubble{
    position:absolute; bottom:-50px;
    background:rgba(255,255,255,0.3);
    border:1px solid rgba(255,255,255,0.6);
    border-radius:50%;
    pointer-events:none;
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0) scale(1); opacity:0; }
    10%{ opacity:0.6; }
    90%{ opacity:0.6; }
    100%{ transform:translateY(-110vh) translateX(var(--bx,20px)) scale(var(--bs,0.8)); opacity:0; }
  }
  .star{
    position:absolute; color:#ffffff;
    text-shadow:0 0 6px rgba(255,255,255,0.8);
    animation:starTwinkle ease-in-out infinite;
  }
  @keyframes starTwinkle{
    0%,100%{ opacity:0.3; transform:scale(0.8); }
    50%{ opacity:1; transform:scale(1.2); }
  }

  .stage{
    position:relative; z-index:3;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top) + 18px) 22px calc(env(safe-area-inset-bottom) + 30px);
    text-align:center;
  }
  .greeting{
    margin:0 0 6px;
    font-size:clamp(22px,6.5vw,32px);
    color:var(--rose);
    letter-spacing:.06em;
    text-shadow:0 3px 10px rgba(255,61,119,.18);
  }
  .stats{
    margin:0 0 22px;
    font-size:clamp(12px,3.6vw,15px);
    color:var(--ink2);
    letter-spacing:.12em;
    opacity:.92;
  }

  .heart-wrap{
    position:relative;
    width:clamp(112px,32vw,165px);
    height:clamp(103px,29.4vw,152px);
    margin-bottom:14px;
  }
  .heart-glow{
    position:absolute; inset:-32%; border-radius:50%;
    background:radial-gradient(circle, rgba(255,120,170,.5), rgba(255,120,170,0) 66%);
    animation:glow 1.4s ease-in-out infinite; z-index:-1;
  }
  @keyframes glow{
    0%,100%{ transform:scale(1); opacity:.7; }
    40%{ transform:scale(1.14); opacity:1; }
  }
  .heart{
    width:100%; height:100%; display:block;
    transform-origin:center;
    animation:beat 1.4s ease-in-out infinite;
    filter:drop-shadow(0 12px 22px rgba(255,61,119,.35));
    cursor:pointer;
    transition:transform 0.1s ease;
  }
  .heart:active{ transform:scale(0.92); }
  .heart-wrap:hover .heart{ filter:drop-shadow(0 12px 28px rgba(255,61,119,.45)); }

  .love-counter{
    margin-top:8px;
    font-size:clamp(14px,4vw,17px);
    color:var(--rose);
    font-weight:bold;
    letter-spacing:0.1em;
    opacity:0;
    transform:translateY(8px);
    transition:opacity 0.6s ease, transform 0.6s ease;
  }
  .love-counter.show{ opacity:1; transform:none; }
  .love-counter span{
    display:inline-block;
    animation:loveGlow 1s ease-in-out infinite alternate;
  }
  @keyframes loveGlow{
    0%{ text-shadow:0 0 8px rgba(255,61,119,.4); }
    100%{ text-shadow:0 0 16px rgba(255,61,119,.7), 0 0 24px rgba(255,61,119,.3); }
  }
  @keyframes beat{
    0%,100%{ transform:scale(1); }
    12%{ transform:scale(1.13); }
    24%{ transform:scale(1); }
    36%{ transform:scale(1.08); }
    48%{ transform:scale(1); }
  }

  .confession{
    max-width:560px;
    display:flex; flex-direction:column; gap:.42em;
    margin-top:6px;
  }
  .line{
    opacity:0; transform:translateY(14px); filter:blur(5px);
    transition:opacity 0.8s ease, transform 0.8s ease, filter 0.8s ease;
    font-size:clamp(16px,4.8vw,21px);
    line-height:1.6;
    color:var(--ink);
    -webkit-user-select:text; user-select:text;
    overflow:hidden;
  }
  .line.show{ opacity:1; transform:none; filter:none; }
  .char{
    display:inline-block;
    opacity:0;
    transform:translateY(8px);
    animation:charPop 0.5s ease forwards;
    animation-delay:calc(var(--char-delay, 0) * 0.08s);
  }
  @keyframes charPop{
    0%{ opacity:0; transform:translateY(8px) scale(0.8); }
    50%{ opacity:1; transform:translateY(-2px) scale(1.1); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }
  .line.sign{ color:var(--rose); margin-top:.5em; }

  .replay{
    margin-top:26px;
    display:none;
    font-family:inherit;
    font-size:clamp(14px,4vw,16px);
    color:var(--rose);
    background:rgba(255,255,255,.55);
    border:1.5px solid rgba(255,61,119,.45);
    border-radius:999px;
    padding:9px 22px;
    cursor:pointer;
    backdrop-filter:blur(4px);
    transition:transform .15s ease, box-shadow .15s ease, background .2s;
  }
  .replay:active{ transform:scale(.95); }
  .replay:hover{ background:rgba(255,255,255,.8); box-shadow:0 6px 18px rgba(255,61,119,.2); }

  

  .music-btn{
    position:fixed; top:calc(env(safe-area-inset-top) + 14px); right:16px;
    z-index:60;
    width:42px; height:42px; border-radius:50%;
    border:1.5px solid rgba(255,61,119,.4);
    background:rgba(255,255,255,.55);
    color:#caa; font-size:18px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; backdrop-filter:blur(4px);
    transition:color .2s, transform .15s, box-shadow .2s;
  }
  .music-btn:active{ transform:scale(.92); }
  .music-btn.on{ color:var(--rose); box-shadow:0 0 14px rgba(255,61,119,.35); }

  .overlay{
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px;
    background:
      radial-gradient(120% 90% at 50% 20%, #fff6fb 0%, rgba(255,246,251,0) 55%),
      linear-gradient(160deg, var(--pink1) 0%, var(--pink2) 45%, var(--pink3) 100%);
    transition:opacity .9s ease, visibility .9s ease;
  }
  .overlay.hide{ opacity:0; visibility:hidden; }
  .ov-heart{
    font-size:clamp(54px,20vw,92px); color:var(--rose);
    animation:beat 1.4s ease-in-out infinite;
    filter:drop-shadow(0 8px 18px rgba(255,61,119,.4));
    margin-bottom:10px;
  }
  .ov h1{
    margin:2px 0 8px;
    font-size:clamp(30px,9vw,46px); color:var(--rose);
    letter-spacing:.05em;
  }
  .ov p{ margin:0; font-size:clamp(14px,4.4vw,17px); color:var(--ink2); letter-spacing:.04em; }
  .ov .hint{
    margin-top:34px;
    font-size:clamp(15px,4.6vw,18px); color:var(--rose);
    padding:10px 26px; border:1.5px dashed rgba(255,61,119,.5);
    border-radius:999px;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ transform:scale(1); opacity:.85; } 50%{ transform:scale(1.05); opacity:1; } }

  .butterfly{ position:fixed; left:0; top:0; will-change:transform; pointer-events:none; }
  .butterfly svg{ width:100%; height:100%; display:block; overflow:visible; }
  .butterfly .wing-r{ transform-box:fill-box; transform-origin:0% 50%; animation:flapR var(--flap,.16s) ease-in-out infinite alternate; }
  .butterfly .wing-l{ transform-box:fill-box; transform-origin:100% 50%; animation:flapL var(--flap,.16s) ease-in-out infinite alternate; }
  @keyframes flapR{ from{ transform:scaleX(1); } to{ transform:scaleX(.28); } }
  @keyframes flapL{ from{ transform:scaleX(1); } to{ transform:scaleX(.28); } }

  .burst-heart{
    position:fixed; color:var(--rose); pointer-events:none;
    text-shadow:0 0 10px rgba(255,61,119,.6);
    transition:transform 1.5s cubic-bezier(.18,.7,.3,1), opacity 1.5s ease-out;
    will-change:transform,opacity;
  }

  #trail{ z-index:7; }
  .trail-b{
    position:fixed; left:0; top:0; pointer-events:none;
    will-change:transform,opacity;
    filter:drop-shadow(0 0 4px rgba(255,120,170,.5));
    animation:trailFade 1.1s ease-out forwards;
  }
  @keyframes trailFade{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.3) rotate(var(--r,0deg)); }
    18%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(var(--r,0deg)); }
    100%{ opacity:0; transform:translate(calc(-50% + var(--dx,0px)), calc(-50% + var(--dy,-40px))) scale(.25) rotate(var(--r2,0deg)); }
  }
</style>
</head>
<body>
  <div class="aurora"></div>
  <div class="aurora2"></div>
  <div class="layer" id="petals"></div>
  <div class="layer" id="butterflies"></div>
  <div class="layer" id="burst"></div>
  <div class="layer" id="trail"></div>

  <main class="stage">
    <p class="greeting">My Love ♡</p>
    <p class="stats" id="stats"></p>

    <div class="heart-wrap" id="heartWrap">
      <div class="heart-glow"></div>
      <svg class="heart" id="heart" viewBox="0 0 100 92" aria-hidden="true">
        <defs>
          <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff9ec4"/>
            <stop offset="1" stop-color="#ff3d77"/>
          </linearGradient>
          <radialGradient id="shine" cx="34%" cy="26%" r="42%">
            <stop offset="0" stop-color="rgba(255,255,255,.75)"/>
            <stop offset="1" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
        </defs>
        <path d="M50,86 C50,86 8,58 8,28 C8,14 20,6 32,6 C40,6 46,11 50,18 C54,11 60,6 68,6 C80,6 92,14 92,28 C92,58 50,86 50,86 Z" fill="url(#hg)"/>
        <path d="M50,86 C50,86 8,58 8,28 C8,14 20,6 32,6 C40,6 46,11 50,18 C54,11 60,6 68,6 C80,6 92,14 92,28 C92,58 50,86 50,86 Z" fill="url(#shine)"/>
      </svg>
    </div>
    <div class="love-counter" id="loveCounter">
      <span>♡</span> I Love You <span id="loveCount">0</span> <span>♡</span>
    </div>

    <div class="confession" id="confession"></div>
    
    <button class="replay" id="replay">Play Again ♡</button>
  </main>

  <button class="music-btn" id="musicBtn" aria-label="背景音乐">♪</button>

  <div class="overlay" id="overlay">
    <div class="ov">
      <div class="ov-heart">♡</div>
      <h1>For You</h1>
      <p>There's a butterfly,<br>and a heart that beats for you</p>
      <div class="hint">Tap to begin ♡</div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  var lines = [
    "To my dearest ——",
    "宇宙山河浪漫，人间点滴温暖，都值得我前进。",
    "而你，是我所有前进的意义。",
    "三月的风很温柔，",
    "就像那天你轻轻对我笑的模样。",
    "四月的阳光很暖，",
    "暖不过你牵起我手时的温度。",
    "你是我藏在云层里的月亮，",
    "也是我穷其一生要寻找的宝藏。",
    "在这个星球上，",
    "你很重要，请你，一定不要忘记。",
    "—— For you, with love ♡"
  ];

  var confession = document.getElementById("confession");
  lines.forEach(function(t, i){
    var p = document.createElement("p");
    p.className = "line" + (i === lines.length-1 ? " sign" : "");
    var chars = t.split('');
    chars.forEach(function(ch, j){
      var span = document.createElement("span");
      span.className = "char";
      span.textContent = ch;
      span.style.setProperty("--char-delay", j);
      p.appendChild(span);
    });
    confession.appendChild(p);
  });

  function daysSince(m, d){
    var now = new Date();
    var y = now.getFullYear();
    var t = new Date(y, m-1, d, 0,0,0,0);
    if(t > now){ t = new Date(y-1, m-1, d, 0,0,0,0); }
    return Math.max(0, Math.floor((now - t)/86400000));
  }
  document.getElementById("stats").textContent =
    "相识 " + daysSince(3,10) + " 天 · 在一起 " + daysSince(4,28) + " 天 ♡";

  /* ---------- 花瓣与星光 ---------- */
  var petalLayer = document.getElementById("petals");
  var PTYPES = ["♡","❀","✿"];
  for(var i=0;i<18;i++){
    var s = document.createElement("span");
    s.className = "petal";
    s.textContent = PTYPES[i % PTYPES.length];
    s.style.left = (Math.random()*100) + "vw";
    s.style.fontSize = (10 + Math.random()*16) + "px";
    s.style.color = ["#ff8fb1","#ff6f9c","#ffd1e3","#c490ff"][i%4];
    s.style.setProperty("--op", (0.4 + Math.random()*0.4).toFixed(2));
    s.style.setProperty("--drift", ((Math.random()*120-60)|0) + "px");
    s.style.animationDuration = (8 + Math.random()*9) + "s";
    s.style.animationDelay = (-Math.random()*14) + "s";
    petalLayer.appendChild(s);
  }
  for(var j=0;j<14;j++){
    var sp = document.createElement("span");
    sp.className = "spark";
    sp.textContent = "✦";
    sp.style.left = (Math.random()*100) + "vw";
    sp.style.top = (Math.random()*100) + "vh";
    sp.style.fontSize = (6 + Math.random()*10) + "px";
    sp.style.color = Math.random()<.5 ? "#ffffff" : "#ffe3ef";
    sp.style.animationDuration = (2.5 + Math.random()*3.5) + "s";
    sp.style.animationDelay = (-Math.random()*5) + "s";
    petalLayer.appendChild(sp);
  }

  /* ---------- 气泡装饰 ---------- */
  for(var k=0;k<8;k++){
    var b = document.createElement("span");
    b.className = "bubble";
    var sz = 12 + Math.random()*28;
    b.style.width = sz + "px";
    b.style.height = sz + "px";
    b.style.left = (Math.random()*100) + "vw";
    b.style.setProperty("--bx", ((Math.random()*100-50)|0) + "px");
    b.style.setProperty("--bs", (0.6 + Math.random()*0.4).toFixed(2));
    b.style.animationDuration = (12 + Math.random()*10) + "s";
    b.style.animationDelay = (-Math.random()*15) + "s";
    petalLayer.appendChild(b);
  }

  /* ---------- 闪烁星星 ---------- */
  for(var m=0;m<12;m++){
    var st = document.createElement("span");
    st.className = "star";
    st.textContent = "★";
    st.style.left = (Math.random()*100) + "vw";
    st.style.top = (Math.random()*100) + "vh";
    st.style.fontSize = (4 + Math.random()*8) + "px";
    st.style.animationDuration = (1.5 + Math.random()*2) + "s";
    st.style.animationDelay = (-Math.random()*3) + "s";
    petalLayer.appendChild(st);
  }

  /* ---------- 蝴蝶 ---------- */
  var schemes = [
    {wing:"#ff7eb3", dot:"#fff0f6", body:"#7a3b5a"},
    {wing:"#c490ff", dot:"#f3e6ff", body:"#5a3b7a"},
    {wing:"#ff9ec4", dot:"#ffffff", body:"#7a3b5a"},
    {wing:"#8ad7ff", dot:"#eaf7ff", body:"#3b5a7a"},
    {wing:"#ffd36e", dot:"#fff7e0", body:"#7a5a2f"},
    {wing:"#ffffff", dot:"#ffd1e3", body:"#7a3b5a"},
    {wing:"#ff5d8f", dot:"#ffffff", body:"#7a2f45"},
    {wing:"#a0e8c0", dot:"#eafff2", body:"#2f6b4a"}
  ];
  var WING_PATH = "M0,-14 C12,-30 34,-30 37,-12 C38,-3 25,-1 5,-3 C24,3 33,14 27,24 C21,30 6,25 2,13 Z";

  function makeButterfly(scheme, size){
    var el = document.createElement("div");
    el.className = "butterfly";
    el.style.width = size + "px";
    el.style.height = (size*0.78) + "px";
    el.style.setProperty("--flap", (0.12 + Math.random()*0.08).toFixed(2) + "s");
    el.innerHTML =
      '<svg viewBox="-44 -34 88 68" aria-hidden="true">' +
        '<g class="wing-l"><g transform="scale(-1,1)">' +
          '<path d="'+WING_PATH+'" fill="'+scheme.wing+'" stroke="'+scheme.body+'" stroke-width="0.6" opacity="0.95"/>' +
          '<circle cx="24" cy="-13" r="2.6" fill="'+scheme.dot+'"/>' +
          '<circle cx="19" cy="15" r="2" fill="'+scheme.dot+'"/>' +
        '</g></g>' +
        '<g class="wing-r">' +
          '<path d="'+WING_PATH+'" fill="'+scheme.wing+'" stroke="'+scheme.body+'" stroke-width="0.6" opacity="0.95"/>' +
          '<circle cx="24" cy="-13" r="2.6" fill="'+scheme.dot+'"/>' +
          '<circle cx="19" cy="15" r="2" fill="'+scheme.dot+'"/>' +
        '</g>' +
        '<g class="body">' +
          '<ellipse cx="0" cy="1" rx="2.4" ry="17" fill="'+scheme.body+'"/>' +
          '<circle cx="0" cy="-15" r="2.8" fill="'+scheme.body+'"/>' +
          '<path d="M0,-16 C-3,-23 -7,-25 -8,-28" stroke="'+scheme.body+'" stroke-width="1" fill="none" stroke-linecap="round"/>' +
          '<path d="M0,-16 C3,-23 7,-25 8,-28" stroke="'+scheme.body+'" stroke-width="1" fill="none" stroke-linecap="round"/>' +
          '<circle cx="-8" cy="-28" r="1.4" fill="'+scheme.body+'"/>' +
          '<circle cx="8" cy="-28" r="1.4" fill="'+scheme.body+'"/>' +
        '</g>' +
      '</svg>';
    return el;
  }

  var bfLayer = document.getElementById("butterflies");
  var butterflies = [];
  var W = window.innerWidth, H = window.innerHeight;

  function heartCenter(){
    var r = document.querySelector(".heart-wrap").getBoundingClientRect();
    return { x: r.left + r.width/2, y: r.top + r.height/2 };
  }

  function addButterfly(scheme, size, mode){
    var el = makeButterfly(scheme, size);
    bfLayer.appendChild(el);
    var b = {
      el:el, w:size, h:size*0.78, mode:mode,
      x:Math.random()*W, y:Math.random()*H,
      vx:0, vy:0, tx:Math.random()*W, ty:Math.random()*H,
      speed:0.6 + Math.random()*0.9,
      bob:Math.random()*Math.PI*2,
      ang:Math.random()*Math.PI*2,
      spin:(Math.random()<.5?-1:1)*(0.004+Math.random()*0.005),
      rx:120 + Math.random()*30, ry:90 + Math.random()*25
    };
    butterflies.push(b);
  }

  addButterfly(schemes[0], 50, "orbit");
  addButterfly(schemes[1], 44, "orbit");
  addButterfly(schemes[5], 46, "orbit");
  addButterfly(schemes[2], 34, "roam");
  addButterfly(schemes[3], 30, "roam");
  addButterfly(schemes[4], 38, "roam");
  addButterfly(schemes[6], 32, "roam");
  addButterfly(schemes[7], 28, "roam");

  function newTarget(b){
    var c = heartCenter();
    if(Math.random() < 0.4){
      b.tx = c.x + (Math.random()*160-80);
      b.ty = c.y + (Math.random()*160-80);
    }else{
      b.tx = Math.random()*W;
      b.ty = Math.random()*H;
    }
  }

  function tick(){
    var c = heartCenter();
    for(var i=0;i<butterflies.length;i++){
      var b = butterflies[i];
      b.bob += 0.06;
      var bobX = Math.cos(b.bob)*3;
      var bobY = Math.sin(b.bob*1.4)*2.5;
      var rot;

      if(b.mode === "orbit"){
        b.ang += b.spin;
        b.x = c.x + Math.cos(b.ang)*b.rx;
        b.y = c.y + Math.sin(b.ang)*b.ry;
        var tvx = -Math.sin(b.ang)*b.rx;
        var tvy =  Math.cos(b.ang)*b.ry;
        rot = Math.atan2(tvy, tvx)*180/Math.PI + 90;
      }else{
        var dx = b.tx - b.x, dy = b.ty - b.y;
        if(dx*dx + dy*dy < 600){ newTarget(b); }
        b.vx += (b.tx - b.x)*0.002*b.speed;
        b.vy += (b.ty - b.y)*0.002*b.speed;
        b.vx *= 0.92; b.vy *= 0.92;
        b.x += b.vx; b.y += b.vy;
        rot = Math.atan2(b.vy, b.vx)*180/Math.PI + 90;
      }

      var dispX = b.x + bobX - b.w/2;
      var dispY = b.y + bobY - b.h/2;
      b.el.style.transform = "translate(" + dispX + "px," + dispY + "px) rotate(" + rot + "deg)";
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  window.addEventListener("resize", function(){
    W = window.innerWidth; H = window.innerHeight;
  });

  /* ---------- 爱心计数器互动 ---------- */
  var loveCount = 0;
  var loveCountEl = document.getElementById("loveCount");
  var loveCounterEl = document.getElementById("loveCounter");
  var heartEl = document.getElementById("heart");
  var heartWrapEl = document.getElementById("heartWrap");

  function showLoveCounter(){
    if(!loveCounterEl.classList.contains("show")){
      loveCounterEl.classList.add("show");
    }
  }

  heartWrapEl.addEventListener("click", function(){
    loveCount++;
    loveCountEl.textContent = loveCount;
    showLoveCounter();
    
    var c = heartCenter();
    var burstCount = Math.min(5 + Math.floor(loveCount / 10), 12);
    
    for(var i=0;i<burstCount;i++){
      var s = document.createElement("span");
      s.className = "burst-heart";
      s.textContent = "♡";
      var sz = 12 + Math.random()*16;
      s.style.fontSize = sz + "px";
      s.style.left = c.x + "px";
      s.style.top = c.y + "px";
      s.style.transform = "translate(-50%,-50%) scale(0.4)";
      s.style.opacity = "1";
      s.style.color = ["#ff5d8f","#ff8fb1","#ff3d77","#c490ff","#ffd36e"][i%5];
      burstLayer.appendChild(s);
      var ang = Math.random()*Math.PI*2;
      var dist = 60 + Math.random()*120 + loveCount*2;
      var dx = Math.cos(ang)*dist;
      var dy = Math.sin(ang)*dist - 50;
      (function(el, dx, dy){
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            el.style.transform = "translate(calc(-50% + "+dx+"px),calc(-50% + "+dy+"px)) scale(" + (0.5+Math.random()*0.9).toFixed(2) + ")";
            el.style.opacity = "0";
          });
        });
        setTimeout(function(){ el.remove(); }, 1500);
      })(s, dx, dy);
    }
    
    heartEl.style.transform = "scale(1.3)";
    setTimeout(function(){ heartEl.style.transform = ""; }, 150);
  });

  /* ---------- 告白文字依次出现 ---------- */
  var lineEls = [].slice.call(document.querySelectorAll(".line"));
  var replay = document.getElementById("replay");
  var revealed = false;

  function startReveal(){
    lineEls.forEach(function(e){ 
      e.classList.remove("show"); 
      var chars = e.querySelectorAll(".char");
      chars.forEach(function(c){ c.style.animation = "none"; });
    });
    replay.style.display = "none";
    
    lineEls.forEach(function(e, i){
      setTimeout(function(){ 
        e.classList.add("show");
        var chars = e.querySelectorAll(".char");
        chars.forEach(function(c){ 
          c.style.animation = ""; 
          c.offsetHeight; 
          c.style.animation = "charPop 0.5s ease forwards";
          c.style.animationDelay = c.style.getPropertyValue("--char-delay") * 0.08 + "s";
        });
      }, 500 + i*900);
    });
    setTimeout(function(){
      burst();
      showLoveCounter();
      replay.style.display = "inline-block";
    }, 500 + lineEls.length*900 + 800);
  }
  replay.addEventListener("click", startReveal);

  /* ---------- 心形爆破 ---------- */
  var burstLayer = document.getElementById("burst");
  function burst(){
    var c = heartCenter();
    for(var i=0;i<16;i++){
      var s = document.createElement("span");
      s.className = "burst-heart";
      s.textContent = "♡";
      var sz = 14 + Math.random()*18;
      s.style.fontSize = sz + "px";
      s.style.left = c.x + "px";
      s.style.top = c.y + "px";
      s.style.transform = "translate(-50%,-50%) scale(0.4)";
      s.style.opacity = "1";
      s.style.color = ["#ff5d8f","#ff8fb1","#ff3d77","#c490ff"][i%4];
      burstLayer.appendChild(s);
      var ang = Math.random()*Math.PI*2;
      var dist = 80 + Math.random()*150;
      var dx = Math.cos(ang)*dist;
      var dy = Math.sin(ang)*dist - 70;
      (function(el, dx, dy){
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            el.style.transform = "translate(calc(-50% + "+dx+"px),calc(-50% + "+dy+"px)) scale(" + (0.6+Math.random()*0.8).toFixed(2) + ")";
            el.style.opacity = "0";
          });
        });
        setTimeout(function(){ el.remove(); }, 1700);
      })(s, dx, dy);
    }
  }

  /* ---------- 光标蝴蝶拖影 ---------- */
  var trailLayer = document.getElementById("trail");
  var lastPX = -9999, lastPY = -9999, trailCount = 0;

  function spawnTrail(x, y){
    var scheme = schemes[Math.floor(Math.random()*schemes.length)];
    var size = 16 + Math.random()*11;
    var el = document.createElement("div");
    el.className = "trail-b";
    el.style.width = size + "px";
    el.style.height = (size*0.78) + "px";
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.setProperty("--flap", (0.1 + Math.random()*0.06).toFixed(2) + "s");
    var r0 = (Math.random()*60-30)|0;
    el.style.setProperty("--r", r0 + "deg");
    el.style.setProperty("--r2", (r0 + ((Math.random()*120-60)|0)) + "deg");
    el.style.setProperty("--dx", ((Math.random()*60-30)|0) + "px");
    el.style.setProperty("--dy", ((-30 - Math.random()*50)|0) + "px");
    el.innerHTML =
      '<svg viewBox="-44 -34 88 68" aria-hidden="true">' +
        '<g class="wing-l"><g transform="scale(-1,1)">' +
          '<path d="'+WING_PATH+'" fill="'+scheme.wing+'" stroke="'+scheme.body+'" stroke-width="0.6" opacity="0.95"/>' +
          '<circle cx="24" cy="-13" r="2.6" fill="'+scheme.dot+'"/>' +
          '<circle cx="19" cy="15" r="2" fill="'+scheme.dot+'"/>' +
        '</g></g>' +
        '<g class="wing-r">' +
          '<path d="'+WING_PATH+'" fill="'+scheme.wing+'" stroke="'+scheme.body+'" stroke-width="0.6" opacity="0.95"/>' +
          '<circle cx="24" cy="-13" r="2.6" fill="'+scheme.dot+'"/>' +
          '<circle cx="19" cy="15" r="2" fill="'+scheme.dot+'"/>' +
        '</g>' +
        '<g class="body">' +
          '<ellipse cx="0" cy="1" rx="2.4" ry="17" fill="'+scheme.body+'"/>' +
          '<circle cx="0" cy="-15" r="2.8" fill="'+scheme.body+'"/>' +
        '</g>' +
      '</svg>';
    trailLayer.appendChild(el);
    trailCount++;
    el.addEventListener("animationend", function(){ el.remove(); trailCount--; });
    if(trailCount > 45 && trailLayer.firstChild){ trailLayer.firstChild.remove(); trailCount--; }
  }

  function onPointerMove(x, y){
    if(!overlay || !overlay.classList.contains("hide")) return;
    var dx = x - lastPX, dy = y - lastPY;
    if(dx*dx + dy*dy > 256){
      spawnTrail(x, y);
      lastPX = x; lastPY = y;
    }
  }
  window.addEventListener("pointermove", function(e){ onPointerMove(e.clientX, e.clientY); }, {passive:true});
  window.addEventListener("pointerdown", function(e){
    if(overlay && overlay.classList.contains("hide")){ spawnTrail(e.clientX, e.clientY); lastPX = e.clientX; lastPY = e.clientY; }
  }, {passive:true});
  window.addEventListener("touchmove", function(e){
    if(e.touches.length){ onPointerMove(e.touches[0].clientX, e.touches[0].clientY); }
  }, {passive:true});

  /* ---------- 背景音乐（音乐盒） ---------- */
  var musicBtn = document.getElementById("musicBtn");
  var audioCtx = null, masterGain = null, schedId = null, step = 0, nextTime = 0, musicOn = false;
  var seq = [
    392.00, 392.00, 523.25, 523.25, 587.33, 587.33, 523.25,
    493.88, 493.88, 440.00, 440.00, 392.00,
    523.25, 523.25, 493.88, 493.88, 440.00,
    523.25, 523.25, 493.88, 493.88, 440.00,
    392.00, 392.00, 349.23, 349.23, 293.66, 293.66, 349.23,
    440.00, 440.00, 392.00, 392.00, 261.63,
    392.00, 440.00, 493.88, 523.25, 587.33,
    493.88, 523.25, 440.00, 392.00,
    293.66, 349.23, 392.00, 440.00, 493.88,
    349.23, 392.00, 293.66, 261.63
  ];
  var rhythm = [
    0.5,0.5,0.5,0.5,0.5,0.5,1.0,
    0.5,0.5,0.5,0.5,1.0,
    0.5,0.5,0.5,0.5,1.0,
    0.5,0.5,0.5,0.5,1.0,
    0.5,0.5,0.5,0.5,0.5,0.5,1.0,
    0.5,0.5,0.5,0.5,1.0,
    0.5,0.5,0.5,0.5,1.0,
    0.5,0.5,0.5,0.5,1.0,
    0.5,0.5,0.5,0.5,1.0,
    0.5,0.5,0.5,0.5
  ];

  function initAudio(){
    if(audioCtx) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0;
      var filter = audioCtx.createBiquadFilter();
      filter.type = "lowpass"; filter.frequency.value = 2000;
      masterGain.connect(filter); filter.connect(audioCtx.destination);
      nextTime = audioCtx.currentTime + 0.1;
      schedId = setInterval(scheduler, 25);
    }catch(e){ audioCtx = null; }
  }
  function playNote(freq, time){
    if(!audioCtx) return;
    var o = audioCtx.createOscillator();
    var o2 = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    var g2 = audioCtx.createGain();
    o.type = "triangle"; o.frequency.value = freq;
    o2.type = "sine"; o2.frequency.value = freq*2;
    g2.gain.value = 0.25;
    o.connect(g); o2.connect(g2); g2.connect(g);
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(0.5, time+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, time+1.7);
    o.start(time); o2.start(time);
    o.stop(time+1.8); o2.stop(time+1.8);
  }
  function scheduler(){
    if(!audioCtx) return;
    while(nextTime < audioCtx.currentTime + 0.3){
      var idx = step % seq.length;
      playNote(seq[idx], nextTime);
      nextTime += (rhythm[idx] || 0.5) * 0.45;
      step++;
    }
  }
  function startMusic(){
    initAudio();
    if(!audioCtx) return;
    if(audioCtx.state === "suspended") audioCtx.resume();
    musicOn = true;
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0.13, audioCtx.currentTime + 0.6);
    musicBtn.classList.add("on");
  }
  function stopMusic(){
    if(!audioCtx) return;
    musicOn = false;
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
    musicBtn.classList.remove("on");
  }
  musicBtn.addEventListener("click", function(){
    if(musicOn) stopMusic(); else startMusic();
  });

  /* ---------- 开场 ---------- */
  var overlay = document.getElementById("overlay");
  function openScene(){
    overlay.classList.add("hide");
    startMusic();
    if(!revealed){ revealed = true; setTimeout(startReveal, 750); }
  }
  overlay.addEventListener("click", openScene, { once:true });
  document.addEventListener("keydown", function(e){
    if(!overlay.classList.contains("hide") && (e.key === "Enter" || e.key === " ")){ openScene(); }
  });
})();
</script>
</body>
</html>
