<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070818">
<title>♡ 七夕 · 鹊桥相会</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Long+Cang&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#070818; --night2:#101530; --night3:#1c2148;
    --moon:#ffe9d2; --star:#ffffff; --gold:#ffd98a; --pink:#ff9ec4;
    --text:#e8edff; --text2:#aab2d6;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
  body{
    background:var(--night);
    color:var(--text);
    font-family:"Ma Shan Zheng","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    -webkit-user-select:none; user-select:none;
    touch-action:none;
    overscroll-behavior:none;
  }

  #sky{
    position:fixed; inset:0; z-index:0; display:block;
    cursor:crosshair;
  }

  .back-btn{
    position:fixed; top:calc(env(safe-area-inset-top)+16px); left:16px; z-index:50;
    width:44px; height:44px; border-radius:50%;
    border:1px solid rgba(232,237,255,.22);
    background:rgba(232,237,255,.06);
    color:var(--text); font-size:21px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; text-decoration:none; backdrop-filter:blur(8px);
    transition:all .25s ease;
  }
  .back-btn:hover{ background:rgba(232,237,255,.16); border-color:rgba(255,217,138,.45); color:#fff; }
  .back-btn:active{ transform:scale(.9); }

  .stage{
    position:relative; z-index:10; pointer-events:none;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top) + 38px) 24px calc(env(safe-area-inset-bottom) + 42px);
    text-align:center;
  }
  .title{
    margin:0 0 10px;
    font-size:clamp(34px,10vw,58px);
    color:var(--text);
    letter-spacing:.08em;
    text-shadow:0 0 24px rgba(120,160,255,.4), 0 8px 24px rgba(0,0,0,.35);
    animation:titleIn 1.1s cubic-bezier(.34,1.56,.64,1) both;
  }
  .title .heart{ display:inline-block; color:var(--pink); animation:beat 1.4s ease-in-out infinite; }
  @keyframes beat{
    0%,100%{ transform:scale(1); }
    12%{ transform:scale(1.2); }
    24%{ transform:scale(1); }
    36%{ transform:scale(1.08); }
    48%{ transform:scale(1); }
  }
  @keyframes titleIn{
    from{ opacity:0; transform:translateY(-16px) scale(.92); filter:blur(6px); }
    to{ opacity:1; transform:none; filter:none; }
  }
  .subtitle{
    margin:0;
    font-family:"Long Cang","PingFang SC","Microsoft YaHei",cursive;
    font-size:clamp(18px,5.4vw,23px);
    color:var(--gold);
    letter-spacing:.12em;
    opacity:0;
    animation:fadeUp 1s ease .35s forwards;
    text-shadow:0 0 16px rgba(255,217,138,.28);
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:none; }
  }

  .hint{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom)+38px);
    transform:translateX(-50%);
    margin:0; z-index:20; pointer-events:none;
    font-size:clamp(13px,3.8vw,15px);
    color:rgba(232,237,255,.55);
    letter-spacing:.1em;
    white-space:nowrap;
    animation:hintPulse 2.4s ease-in-out infinite;
  }
  @keyframes hintPulse{ 0%,100%{ opacity:.35; } 50%{ opacity:.85; } }

  .counter{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom)+66px);
    transform:translateX(-50%);
    margin:0; z-index:20; pointer-events:none;
    font-size:clamp(12px,3.4vw,14px);
    color:var(--text2);
    letter-spacing:.08em; white-space:nowrap;
    opacity:0; transition:opacity .7s ease;
  }
  .counter.show{ opacity:1; }
  .counter span{ color:var(--gold); font-weight:bold; }

  .wish{
    position:fixed; left:50%; top:calc(env(safe-area-inset-top)+86px);
    transform:translateX(-50%) translateY(10px);
    z-index:30; pointer-events:none;
    max-width:86vw; text-align:center;
    font-family:"Long Cang","PingFang SC","Microsoft YaHei",cursive;
    font-size:clamp(18px,5.5vw,24px);
    color:var(--text);
    text-shadow:0 0 24px rgba(255,158,196,.45);
    opacity:0;
    transition:opacity .5s ease, transform .5s ease;
  }
  .wish.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .overlay{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    padding:30px; text-align:center;
    background:
      radial-gradient(120% 90% at 50% 20%, #161b3b 0%, rgba(22,27,59,0) 55%),
      linear-gradient(165deg, #05070f 0%, #0b0f2a 48%, #171338 100%);
    transition:opacity .8s ease, visibility .8s ease;
  }
  .overlay.hide{ opacity:0; visibility:hidden; }
  .ov-star{
    font-size:clamp(46px,16vw,72px); color:var(--gold);
    text-shadow:0 0 26px rgba(255,217,138,.55);
    animation:starFloat 3s ease-in-out infinite;
  }
  @keyframes starFloat{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-10px) rotate(18deg); } }
  .ov h1{
    margin:8px 0 10px;
    font-size:clamp(32px,9vw,52px);
    color:var(--text); letter-spacing:.08em;
  }
  .ov p{
    margin:0;
    font-family:"Long Cang","PingFang SC","Microsoft YaHei",cursive;
    font-size:clamp(17px,5vw,21px);
    color:var(--text2); line-height:1.7;
  }
  .begin{
    margin-top:32px;
    font-family:inherit;
    font-size:clamp(15px,4.4vw,18px);
    color:#23122a;
    background:linear-gradient(135deg, #ffe6b0, #ffc46e);
    border:0; border-radius:999px;
    padding:11px 30px; cursor:pointer;
    box-shadow:0 10px 30px rgba(255,196,110,.28), 0 0 24px rgba(255,196,110,.2);
    transition:transform .18s ease, box-shadow .2s ease;
  }
  .begin:hover{ transform:translateY(-2px); box-shadow:0 14px 34px rgba(255,196,110,.4), 0 0 30px rgba(255,196,110,.28); }
  .begin:active{ transform:scale(.95); }
</style>
</head>
<body>
  <canvas id="sky"></canvas>

  <a class="back-btn" href="index.html" aria-label="返回主页">←</a>

  <main class="stage">
    <h1 class="title">七夕 <span class="heart">♡</span> 鹊桥相会</h1>
    <p class="subtitle">金风玉露一相逢，便胜却人间无数</p>
  </main>

  <p class="hint" id="hint">轻触夜空，放一盏祈愿灯</p>
  <p class="counter" id="counter">已点亮 <span id="countNum">0</span> 份心意 ♡</p>
  <div class="wish" id="wish"></div>

  <div class="overlay" id="overlay">
    <div class="ov">
      <div class="ov-star">✦</div>
      <h1>七夕快乐</h1>
      <p>牛郎与织女，在鹊桥重逢<br>而我想在银河这头，对你说</p>
      <button class="begin" id="beginBtn" type="button">点亮鹊桥 ♡</button>
    </div>
  </div>

<script>
(function(){
  "use strict";

  var canvas = document.getElementById("sky");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildStars();
  }

  /* ---------- 静态星空 ---------- */
  var starCanvas = null, starCtx = null;
  function buildStars(){
    starCanvas = document.createElement("canvas");
    starCanvas.width = canvas.width;
    starCanvas.height = canvas.height;
    starCtx = starCanvas.getContext("2d");
    starCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var n = Math.floor(W * H / 4200);
    for(var i=0;i<n;i++){
      var x = Math.random()*W, y = Math.random()*H;
      var r = 0.25 + Math.random()*1.3;
      var a = 0.18 + Math.random()*0.75;
      starCtx.globalAlpha = a;
      starCtx.beginPath();
      starCtx.arc(x, y, r, 0, Math.PI*2);
      starCtx.fillStyle = Math.random() < 0.12 ? "#ffd98a" : "#ffffff";
      starCtx.fill();
    }
    starCtx.globalAlpha = 1;
  }

  /* ---------- 核心星体 ---------- */
  function drawGlow(x, y, radius, color){
    var g = ctx.createRadialGradient(x, y, 0, x, y, radius);
    g.addColorStop(0, color);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  function drawBrightStar(x, y, r, color){
    drawGlow(x, y, r*7, color);
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.65)";
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-r*4.5, 0); ctx.lineTo(r*4.5, 0);
    ctx.moveTo(0, -r*4.5); ctx.lineTo(0, r*4.5);
    ctx.stroke();
    ctx.restore();
  }

  /* ---------- 银河 ---------- */
  function drawMilkyWay(t){
    var g = ctx.createLinearGradient(0, H*0.1, 0, H*0.9);
    g.addColorStop(0, "rgba(255,255,255,0)");
    g.addColorStop(0.35, "rgba(140,170,255,0.12)");
    g.addColorStop(0.5, "rgba(255,215,240,0.16)");
    g.addColorStop(0.65, "rgba(140,170,255,0.10)");
    g.addColorStop(1, "rgba(255,255,255,0)");

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = g;
    ctx.lineCap = "round";
    ctx.lineWidth = H*0.16;
    ctx.beginPath();
    var step = 12;
    for(var x=-50;x<=W+50;x+=step){
      var y = H*0.52 + Math.sin(x*0.006 + t*0.25) * H*0.035 + Math.sin(x*0.014 - t*0.16) * H*0.018;
      if(x === -50){ ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
    }
    ctx.stroke();

    ctx.lineWidth = H*0.045;
    ctx.strokeStyle = "rgba(255,255,255,.055)";
    ctx.beginPath();
    for(var x2=-50;x2<=W+50;x2+=step){
      var y2 = H*0.52 + Math.sin(x2*0.006 + t*0.25) * H*0.035 + Math.sin(x2*0.014 - t*0.16) * H*0.018;
      if(x2 === -50){ ctx.moveTo(x2, y2); } else { ctx.lineTo(x2, y2); }
    }
    ctx.stroke();
    ctx.restore();
  }

  /* ---------- 鹊桥 ---------- */
  function quadraticPoint(p0, p1, p2, t){
    var u = 1 - t;
    return {
      x: u*u*p0.x + 2*u*t*p1.x + t*t*p2.x,
      y: u*u*p0.y + 2*u*t*p1.y + t*t*p2.y
    };
  }

  function drawBird(x, y, angle, s, flip){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    if(flip){ ctx.scale(1, -1); }
    ctx.scale(s, s);
    ctx.lineJoin = "round";

    ctx.fillStyle = "#0d1022";
    ctx.beginPath();
    ctx.ellipse(0, 0, 8, 4.2, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.ellipse(2.5, 0.8, 4.2, 2.1, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#0d1022";
    ctx.beginPath();
    ctx.arc(7, -3.4, 3.1, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#ffc46e";
    ctx.beginPath();
    ctx.moveTo(9.6, -3.6); ctx.lineTo(12.2, -2.2); ctx.lineTo(9.4, -1.4);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "#131a38";
    ctx.lineWidth = 2.1;
    ctx.beginPath();
    ctx.moveTo(-3.5, -1.2);
    ctx.quadraticCurveTo(-8, -7, -13, -8);
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(7.8, -4.1, 0.55, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function starPositions(){
    return {
      left: { x: W*0.23, y: H*0.34 },
      right: { x: W*0.77, y: H*0.34 }
    };
  }

  function drawBridge(progress, t){
    if(progress <= 0) return;
    var p = starPositions();
    var count = 19;
    var control = { x: (p.left.x + p.right.x)/2, y: p.left.y - H*0.20 };
    var visible = Math.floor(count * progress);
    for(var i=0;i<visible;i++){
      var tt = i/(count-1);
      var pt = quadraticPoint(p.left, control, p.right, tt);
      var next = quadraticPoint(p.left, control, p.right, Math.min(1, (i+1)/(count-1)));
      var angle = Math.atan2(next.y - pt.y, next.x - pt.x);
      var bob = Math.sin(t*4 + i*0.8) * 2.2;
      var s = 0.55 + (Math.sin(i*0.9) * 0.08);
      drawBird(pt.x, pt.y + bob, angle, s, i % 2 === 0);
    }
  }

  /* ---------- 祈愿灯 ---------- */
  var lanterns = [];
  var glowSprite = null;
  function getGlowSprite(){
    if(glowSprite) return glowSprite;
    glowSprite = document.createElement("canvas");
    glowSprite.width = glowSprite.height = 96;
    var g = glowSprite.getContext("2d");
    var c = 48;
    var grad = g.createRadialGradient(c, c, 0, c, c, c);
    grad.addColorStop(0, "rgba(255,240,180,0.95)");
    grad.addColorStop(0.25, "rgba(255,170,80,0.45)");
    grad.addColorStop(1, "rgba(255,100,50,0)");
    g.fillStyle = grad;
    g.fillRect(0, 0, 96, 96);
    return glowSprite;
  }

  function spawnLantern(x, y, fromBottom){
    lanterns.push({
      x: x,
      y: fromBottom ? H + 20 : y,
      vx: (Math.random()*0.3 - 0.15),
      vy: fromBottom ? -(0.45 + Math.random()*0.5) : -(0.35 + Math.random()*0.45),
      phase: Math.random()*Math.PI*2,
      size: 15 + Math.random()*14,
      life: 1,
      decay: 0.0016 + Math.random()*0.0012
    });
  }

  function drawLantern(l){
    var sx = l.x + Math.sin(l.phase + performance.now()*0.001) * 4;
    var sy = l.y;
    var s = l.size;

    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = Math.max(0, l.life) * 0.85;
    ctx.drawImage(getGlowSprite(), sx - s*2.4, sy - s*2.4, s*4.8, s*4.8);

    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = Math.max(0, l.life);
    ctx.save();
    ctx.translate(sx, sy);

    ctx.strokeStyle = "rgba(40,22,12,.75)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -s*0.72);
    ctx.lineTo(0, -s*1.05);
    ctx.stroke();

    var bodyGrad = ctx.createLinearGradient(-s*0.7, 0, s*0.7, 0);
    bodyGrad.addColorStop(0, "#ff9a3c");
    bodyGrad.addColorStop(0.5, "#ffd98a");
    bodyGrad.addColorStop(1, "#ff9a3c");
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, s*0.7, s*0.78, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = "rgba(120,45,20,.75)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-s*0.55, -s*0.48); ctx.lineTo(s*0.55, -s*0.48);
    ctx.moveTo(-s*0.58, s*0.42); ctx.lineTo(s*0.58, s*0.42);
    ctx.stroke();

    ctx.fillStyle = "#fff3cf";
    ctx.font = "600 " + (s*0.68) + "px 'Ma Shan Zheng','PingFang SC',sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("愿", 0, 0);

    ctx.strokeStyle = "rgba(255,240,190,.8)";
    ctx.beginPath();
    ctx.moveTo(0, s*0.78);
    ctx.lineTo(0, s*1.25);
    ctx.stroke();
    ctx.restore();
  }

  function updateLanterns(){
    for(var i=lanterns.length-1;i>=0;i--){
      var l = lanterns[i];
      l.phase += 0.04;
      l.x += l.vx + Math.sin(l.phase)*0.08;
      l.y += l.vy;
      l.life -= l.decay;
      if(l.life <= 0 || l.y < -80){
        lanterns.splice(i, 1);
      }
    }
  }

  /* ---------- 流星 ---------- */
  var shootingStars = [];
  function spawnShootingStar(){
    shootingStars.push({
      x: W*0.2 + Math.random()*W*0.6,
      y: H*0.05 + Math.random()*H*0.25,
      vx: 5 + Math.random()*3,
      vy: 2.2 + Math.random()*1.3,
      life: 1
    });
  }

  function drawShootingStars(){
    for(var i=shootingStars.length-1;i>=0;i--){
      var m = shootingStars[i];
      m.x += m.vx;
      m.y += m.vy;
      m.life -= 0.018;
      if(m.life <= 0){ shootingStars.splice(i, 1); continue; }

      var tailX = m.x - m.vx*10;
      var tailY = m.y - m.vy*10;
      var g = ctx.createLinearGradient(tailX, tailY, m.x, m.y);
      g.addColorStop(0, "rgba(255,255,255,0)");
      g.addColorStop(1, "rgba(255,255,255," + (m.life*0.85).toFixed(2) + ")");
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      ctx.lineTo(m.x, m.y);
      ctx.stroke();
      ctx.globalCompositeOperation = "source-over";
    }
  }

  /* ---------- 文案 ---------- */
  var wishes = [
    "金风玉露一相逢，便胜却人间无数",
    "愿我如星君如月，夜夜流光相皎洁",
    "两情若是久长时，又岂在朝朝暮暮",
    "你是我银河里，最亮的那颗星",
    "愿有岁月可回首，且以深情共白头",
    "隔着银河我也能认出你",
    "今晚夜色真美，你也是",
    "见山是山，见海是海，见你是全世界"
  ];
  var wishEl = document.getElementById("wish");
  var wishTimer = null;
  function showWish(){
    wishEl.textContent = wishes[Math.floor(Math.random()*wishes.length)];
    wishEl.classList.add("show");
    if(wishTimer) clearTimeout(wishTimer);
    wishTimer = setTimeout(function(){
      wishEl.classList.remove("show");
    }, 3200);
  }

  /* ---------- 计数 ---------- */
  var count = 0;
  var countEl = document.getElementById("countNum");
  var counterEl = document.getElementById("counter");
  function addLight(x, y, fromBottom){
    spawnLantern(x, y, fromBottom);
    count++;
    countEl.textContent = count;
    counterEl.classList.add("show");
    if(!fromBottom && Math.random() < 0.72){ showWish(); }
  }

  /* ---------- 开场 ---------- */
  var overlay = document.getElementById("overlay");
  var beginBtn = document.getElementById("beginBtn");
  var started = false;
  var bridgeStart = 0;

  function start(){
    if(started) return;
    started = true;
    bridgeStart = performance.now();
    overlay.classList.add("hide");
    setTimeout(function(){
      addLight(W*0.22, H*0.58, true);
      addLight(W*0.78, H*0.58, true);
    }, 500);
  }

  beginBtn.addEventListener("click", function(e){
    e.stopPropagation();
    start();
  });
  overlay.addEventListener("click", start);
  document.addEventListener("keydown", function(e){
    if(!started && (e.key === "Enter" || e.key === " ")){
      e.preventDefault();
      start();
    }
  });

  /* ---------- 交互 ---------- */
  var hint = document.getElementById("hint");
  var lastInteract = Date.now();
  canvas.addEventListener("pointerdown", function(e){
    if(!started) return;
    lastInteract = Date.now();
    hint.style.opacity = "0";
    addLight(e.clientX, e.clientY, false);
  });

  function autoLights(){
    if(started && Date.now() - lastInteract > 5000){
      addLight(W*0.15 + Math.random()*W*0.7, H + 20, true);
      if(Math.random() < 0.3){ showWish(); }
    }
    setTimeout(autoLights, 1800 + Math.random()*1500);
  }
  setTimeout(autoLights, 6000);

  var shootingTimer = null;
  function scheduleShootingStar(){
    if(started && Math.random() < 0.85){ spawnShootingStar(); }
    shootingTimer = setTimeout(scheduleShootingStar, 3200 + Math.random()*3600);
  }
  scheduleShootingStar();

  /* ---------- 主循环 ---------- */
  function loop(){
    var now = performance.now();
    var t = now * 0.001;

    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#070818";
    ctx.fillRect(0, 0, W, H);

    var bgGrad = ctx.createRadialGradient(W*0.5, H*0.2, 0, W*0.5, H*0.2, Math.max(W, H)*0.85);
    bgGrad.addColorStop(0, "#141a3d");
    bgGrad.addColorStop(1, "#070818");
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    ctx.drawImage(starCanvas, 0, 0, W, H);
    drawMilkyWay(t);

    var p = starPositions();
    drawBrightStar(p.left.x, p.left.y, 4.4, "#c9dcff");
    drawBrightStar(p.right.x, p.right.y, 5.0, "#ffe1a8");

    var progress = started ? Math.min(1, (now - bridgeStart) / 1800) : 0;
    drawBridge(progress, t);

    updateLanterns();
    for(var i=0;i<lanterns.length;i++){ drawLantern(lanterns[i]); }
    drawShootingStars();

    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", resize);
  resize();
  loop();
})();
</script>
</body>
</html>
