<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd1e3">
<title>♡ 恋爱100天</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Long+Cang&display=swap" rel="stylesheet">
<style>
  :root{
    --pink1:#ffeaf4; --pink2:#ffd1e3; --pink3:#f7b8d4; --rose:#ff3d77;
    --ink:#7a2f45; --ink2:#9a4f68;
  }
  *,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(120% 80% at 50% -10%, #fff6fb 0%, rgba(255,246,251,0) 60%),
      linear-gradient(160deg, var(--pink1) 0%, var(--pink2) 42%, var(--pink3) 100%);
    background-attachment:fixed;
    font-family:"Ma Shan Zheng","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
  }

  .aurora{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(255,150,200,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(200,150,255,0.12) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 50%, rgba(255,200,220,0.1) 0%, transparent 55%),
      radial-gradient(ellipse at 10% 80%, rgba(150,200,255,0.08) 0%, transparent 40%),
      radial-gradient(ellipse at 90% 20%, rgba(255,200,180,0.1) 0%, transparent 45%);
    animation:auroraMove 25s ease-in-out infinite;
  }
  @keyframes auroraMove{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    25%{ transform:translate(3%,-2%) rotate(1deg); }
    50%{ transform:translate(-2%,3%) rotate(-1deg); }
    75%{ transform:translate(-3%,-2%) rotate(1deg); }
  }

  .layer{ position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  #petals{ z-index:1; }
  #burst{ z-index:6; }

  .petal{
    position:absolute; top:-8vh; color:#ff8fb1; opacity:0;
    text-shadow:0 0 6px rgba(255,120,170,.4);
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{ transform:translateY(-8vh) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:var(--op,.7); }
    92%{ opacity:var(--op,.7); }
    100%{ transform:translateY(108vh) translateX(var(--drift,30px)) rotate(360deg); opacity:0; }
  }

  .back-btn{
    position:fixed; top:calc(env(safe-area-inset-top)+16px); left:16px; z-index:50;
    width:42px; height:42px; border-radius:50%;
    border:1.5px solid rgba(255,61,119,.35);
    background:rgba(255,255,255,.55);
    color:var(--rose); font-size:20px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; backdrop-filter:blur(6px); text-decoration:none;
    transition:all .25s ease;
  }
  .back-btn:hover{ background:rgba(255,255,255,.8); border-color:rgba(255,61,119,.55); }
  .back-btn:active{ transform:scale(.9); }

  .stage{
    position:relative; z-index:3;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top) + 26px) 22px calc(env(safe-area-inset-bottom) + 26px);
    text-align:center;
  }

  .badge{
    display:inline-block;
    margin-bottom:12px;
    padding:6px 16px;
    border:1px dashed rgba(255,61,119,.4);
    border-radius:999px;
    font-size:clamp(12px,3.6vw,14px);
    color:var(--ink2);
    letter-spacing:.14em;
    background:rgba(255,255,255,.35);
    backdrop-filter:blur(4px);
    animation:fadeUp .8s ease both;
  }

  .title{
    margin:0 0 4px;
    font-size:clamp(28px,8vw,44px);
    color:var(--rose);
    letter-spacing:.06em;
    text-shadow:0 3px 12px rgba(255,61,119,.2);
    animation:fadeUp .8s ease .12s both;
  }
  .title .heart{
    display:inline-block;
    animation:beat 1.4s ease-in-out infinite;
  }
  @keyframes beat{
    0%,100%{ transform:scale(1); }
    12%{ transform:scale(1.18); }
    24%{ transform:scale(1); }
    36%{ transform:scale(1.1); }
    48%{ transform:scale(1); }
  }

  .sub{
    margin:0;
    font-size:clamp(14px,4.2vw,17px);
    color:var(--ink2);
    letter-spacing:.1em;
    opacity:.9;
    animation:fadeUp .8s ease .22s both;
  }
  .sub b{ color:var(--rose); font-weight:bold; }

  .ring-wrap{
    position:relative;
    width:clamp(190px,56vw,240px);
    margin:clamp(16px,4vh,26px) 0 14px;
    animation:fadeUp .8s ease .34s both;
  }
  .ring{ width:100%; height:auto; display:block; transform:rotate(-90deg); }
  .ring-track{ stroke:rgba(255,61,119,.12); stroke-width:9; }
  .ring-progress{
    stroke:url(#rg); stroke-width:9; stroke-linecap:round;
    filter:drop-shadow(0 0 6px rgba(255,61,119,.45));
    transition:stroke-dashoffset 1.8s cubic-bezier(.4,0,.2,1);
  }
  .ring-center{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .ring-num{
    font-size:clamp(54px,18vw,78px);
    color:var(--rose);
    line-height:1;
    text-shadow:0 4px 16px rgba(255,61,119,.25);
  }
  .ring-label{
    margin-top:2px;
    font-size:clamp(12px,3.8vw,15px);
    color:var(--ink2);
    letter-spacing:.3em;
  }

  .timer{
    margin:0 0 4px;
    font-size:clamp(13px,3.8vw,15px);
    color:var(--ink2);
    letter-spacing:.1em;
    opacity:.85;
    animation:fadeUp .8s ease .46s both;
  }
  .timer span{ color:var(--rose); font-weight:bold; }

  .lines{
    max-width:520px;
    margin-top:clamp(16px,4vh,24px);
    display:flex; flex-direction:column; gap:.35em;
  }
  .lines p{
    margin:0;
    font-size:clamp(16px,4.8vw,20px);
    line-height:1.6;
    color:var(--ink);
    opacity:0; transform:translateY(12px);
    animation:fadeUp .8s ease forwards;
  }
  .lines p:nth-child(1){ animation-delay:.58s; }
  .lines p:nth-child(2){ animation-delay:.7s; }
  .lines p:nth-child(3){ animation-delay:.82s; }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:none; }
  }

  .milestones{
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:10px;
    margin-top:clamp(18px,4.5vh,28px);
    max-width:560px;
  }
  .mile{
    min-width:clamp(130px,40vw,168px);
    padding:10px 14px 12px;
    background:rgba(255,255,255,.45);
    border:1.5px solid rgba(255,61,119,.18);
    border-radius:16px;
    backdrop-filter:blur(5px);
    opacity:0; transform:translateY(12px);
    animation:fadeUp .8s ease forwards;
  }
  .mile:nth-child(1){ animation-delay:.95s; }
  .mile:nth-child(2){ animation-delay:1.05s; }
  .mile:nth-child(3){ animation-delay:1.15s; }
  .mile span{
    display:block;
    font-size:clamp(15px,4.4vw,18px);
    color:var(--rose);
    letter-spacing:.08em;
    font-weight:bold;
  }
  .mile em{
    display:block;
    margin-top:2px;
    font-style:normal;
    font-size:clamp(12px,3.5vw,14px);
    color:var(--ink2);
    letter-spacing:.05em;
    opacity:.85;
  }

  .hint{
    margin-top:clamp(18px,4vh,26px);
    font-size:clamp(12px,3.6vw,14px);
    color:var(--rose);
    letter-spacing:.1em;
    opacity:.75;
    animation:hintPulse 2.4s ease-in-out .6s infinite;
  }
  @keyframes hintPulse{
    0%,100%{ opacity:.45; transform:scale(1); }
    50%{ opacity:.9; transform:scale(1.03); }
  }

  .footer{
    margin-top:clamp(20px,5vh,32px);
    font-size:clamp(12px,3.4vw,14px);
    color:var(--ink2);
    opacity:.6;
    letter-spacing:.1em;
  }
  .footer .heart{
    display:inline-block;
    color:var(--rose);
    animation:beatFoot 1.4s ease-in-out infinite;
  }
  @keyframes beatFoot{
    0%,100%{ transform:scale(1); }
    25%{ transform:scale(1.2); }
    50%{ transform:scale(1); }
  }

  .pop-heart{
    position:fixed; left:0; top:0; z-index:30;
    pointer-events:none;
    transform:translate(-50%,-50%);
    text-shadow:0 0 8px rgba(255,61,119,.35);
    animation:popHeart ease-out forwards;
  }
  @keyframes popHeart{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.4); }
    15%{ opacity:1; transform:translate(-50%,-50%) scale(1.15); }
    100%{ opacity:0; transform:translate(calc(-50% + var(--dx,0px)), calc(-50% + var(--dy,-80px))) scale(.7); }
  }
</style>
</head>
<body>
  <div class="aurora"></div>
  <div class="layer" id="petals"></div>
  <div class="layer" id="burst"></div>

  <a class="back-btn" href="index.html" aria-label="返回主页">←</a>

  <main class="stage">
    <span class="badge">从 2026.04.29 开始的故事</span>
    <h1 class="title">恋爱 <span class="heart">♡</span> 100 天</h1>
    <p class="sub">今天，是我们相爱的第 <b id="dayNum">100</b> 天</p>

    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 160 160" aria-hidden="true">
        <defs>
          <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff6f9c"/>
            <stop offset="100%" stop-color="#ff3d77"/>
          </linearGradient>
        </defs>
        <circle class="ring-track" cx="80" cy="80" r="70"/>
        <circle class="ring-progress" id="ringProgress" cx="80" cy="80" r="70"/>
      </svg>
      <div class="ring-center">
        <span class="ring-num" id="ringNum">100</span>
        <span class="ring-label">天 · 心动满分</span>
      </div>
    </div>

    <p class="timer">我们已经一起走了 <span id="timer">100 天 00:00:00</span></p>

    <div class="lines">
      <p>从遇见你的那天起，日子就有了名字</p>
      <p>一百天不长，刚好够我确定一件事——就是你</p>
      <p>往后的每一天，我都想和你一起数</p>
    </div>

    <div class="milestones">
      <div class="mile"><span>第 1 天</span><em>遇见你，满心欢喜</em></div>
      <div class="mile"><span>第 50 天</span><em>越来越确定，是你</em></div>
      <div class="mile"><span>第 100 天</span><em>今天，依然心动</em></div>
    </div>

    <p class="hint">轻轻点一下屏幕，送出一颗小心心</p>
    <p class="footer">每一天都算数 · Made with <span class="heart">♡</span></p>
  </main>

<script>
(function(){
  "use strict";

  /* ── 恋爱第一天：把日期改成你们在一起的那天，天数会自动计算 ── */
  var START = new Date(2026, 3, 29, 0, 0, 0);

  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function tick(){
    var now = new Date();
    var ms = now.getTime() - START.getTime();
    if (ms < 0) ms = 0;
    var DAY = 86400000;
    var days = Math.floor(ms / DAY) + 1;
    var rest = ms % DAY;
    var h = Math.floor(rest / 3600000);
    var m = Math.floor(rest % 3600000 / 60000);
    var s = Math.floor(rest % 60000 / 1000);
    var txt = days + " 天 " + pad(h) + ":" + pad(m) + ":" + pad(s);
    document.getElementById("dayNum").textContent = days;
    document.getElementById("ringNum").textContent = days;
    document.getElementById("timer").textContent = txt;
  }
  setInterval(tick, 1000);
  tick();

  /* ── 圆环填满 ── */
  var ring = document.getElementById("ringProgress");
  var C = 2 * Math.PI * 70;
  ring.style.strokeDasharray = C;
  ring.style.strokeDashoffset = C;
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ ring.style.strokeDashoffset = "0"; });
  });

  /* ── 花瓣 ── */
  var petalLayer = document.getElementById("petals");
  var PTYPES = ["♡","❀","✿"];
  for(var i=0;i<14;i++){
    var s = document.createElement("span");
    s.className = "petal";
    s.textContent = PTYPES[i % PTYPES.length];
    s.style.left = (Math.random()*100) + "vw";
    s.style.fontSize = (10 + Math.random()*14) + "px";
    s.style.color = ["#ff8fb1","#ff6f9c","#ffd1e3","#c490ff"][i%4];
    s.style.setProperty("--op", (0.35 + Math.random()*0.4).toFixed(2));
    s.style.setProperty("--drift", ((Math.random()*100-50)|0) + "px");
    s.style.animationDuration = (9 + Math.random()*10) + "s";
    s.style.animationDelay = (-Math.random()*15) + "s";
    petalLayer.appendChild(s);
  }

  /* ── 点击屏幕冒小心心 ── */
  var burst = document.getElementById("burst");
  var TYPES = ["♡","♥","❀","✿"];
  var COLORS = ["#ff3d77","#ff6f9c","#ff9bbd","#c490ff"];
  document.addEventListener("pointerdown", function(e){
    var el = document.createElement("span");
    el.className = "pop-heart";
    el.textContent = TYPES[(Math.random()*TYPES.length)|0];
    el.style.left = e.clientX + "px";
    el.style.top = e.clientY + "px";
    el.style.fontSize = (14 + Math.random()*18) + "px";
    el.style.color = COLORS[(Math.random()*COLORS.length)|0];
    el.style.setProperty("--dx", ((Math.random()*120-60)|0) + "px");
    el.style.setProperty("--dy", (-(60+Math.random()*110)|0) + "px");
    el.style.animationDuration = (1.2 + Math.random()*0.8) + "s";
    burst.appendChild(el);
    setTimeout(function(){
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 2200);
  });
})();
</script>
</body>
</html>
