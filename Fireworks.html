<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050510">
<title>♡ 心动烟火</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Long+Cang&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body{ overflow:hidden; width:100%; height:100%; }
  body{
    background:#050510;
    font-family:"Ma Shan Zheng","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  #sky{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 80% 60% at 75% 15%, rgba(80,40,120,0.35) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 20% 85%, rgba(40,60,100,0.25) 0%, transparent 55%),
      linear-gradient(180deg, #050510 0%, #0c0a22 30%, #140e2e 55%, #0a0820 80%, #050510 100%);
  }
  #c{ position:fixed; inset:0; z-index:1; display:block; }

  .back-btn{
    position:fixed; top:calc(env(safe-area-inset-top)+16px); left:16px; z-index:50;
    width:42px; height:42px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06);
    color:rgba(255,255,255,.7); font-size:20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; backdrop-filter:blur(8px); text-decoration:none;
    transition:all .25s ease;
  }
  .back-btn:hover{ background:rgba(255,255,255,.14); border-color:rgba(255,150,200,.4); color:#ffb3d1; }
  .back-btn:active{ transform:scale(.9); }

  .title{
    position:fixed; top:calc(env(safe-area-inset-top)+20px); left:50%; transform:translateX(-50%); z-index:50;
    font-size:clamp(15px,4vw,20px);
    color:rgba(255,200,220,.5); letter-spacing:.12em;
    white-space:nowrap; text-shadow:0 0 24px rgba(255,100,150,.25);
  }

  .counter{
    position:fixed; bottom:calc(env(safe-area-inset-bottom)+30px); left:50%; transform:translateX(-50%); z-index:50;
    font-size:clamp(12px,3.2vw,14px); color:rgba(255,180,210,.5);
    letter-spacing:.06em; white-space:nowrap;
    opacity:0; transition:opacity 1s ease;
  }
  .counter.show{ opacity:1; }
  .counter span{ color:#ff6b9d; font-weight:bold; }

  .hint{
    position:fixed; bottom:calc(env(safe-area-inset-bottom)+60px); left:50%; transform:translateX(-50%); z-index:50;
    font-size:clamp(11px,3vw,13px); color:rgba(255,255,255,.25);
    letter-spacing:.08em; white-space:nowrap;
    animation:hp 2.5s ease-in-out infinite; transition:opacity .6s ease;
  }
  .hint.gone{ opacity:0; }
  @keyframes hp{ 0%,100%{opacity:.2} 50%{opacity:.55} }

  .love-msg{
    position:fixed; z-index:30; pointer-events:none;
    font-family:"Ma Shan Zheng","Long Cang",sans-serif;
    white-space:nowrap;
    transform:translate(-50%,-50%) scale(0); opacity:0;
    transition:transform 1.4s cubic-bezier(.34,1.56,.64,1), opacity .8s ease;
  }
  .love-msg.show{ transform:translate(-50%,-50%) scale(1); opacity:1; }
  .love-msg.fade{
    transform:translate(-50%,-50%) scale(1.5); opacity:0;
    transition:transform 2s ease-out, opacity 1.5s ease-out;
  }
</style>
</head>
<body>
  <div id="sky"></div>
  <canvas id="c"></canvas>

  <a class="back-btn" href="index.html" aria-label="返回">←</a>
  <div class="title">♡ 心动烟火</div>
  <div class="hint" id="hint">轻触夜空 · 绽放心动</div>
  <div class="counter" id="counter">已为你绽放 <span id="countNum">0</span> 次心动 ♡</div>

<script>
(function(){
  "use strict";

  /* ═════════ Canvas ═════════ */
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d", { alpha: true });
  var W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();

  /* ═════════ 预渲染粒子精灵 ═════════
     核心优化：把发光粒子预先画到离屏 canvas，
     运行时只 drawImage，避免每帧 shadowBlur（性能杀手） */
  var SPRITE_SIZE = 64;
  var spriteCache = {};

  function getSprite(color){
    if(spriteCache[color]) return spriteCache[color];
    var s = document.createElement("canvas");
    s.width = s.height = SPRITE_SIZE;
    var sx = s.getContext("2d");
    var cx = SPRITE_SIZE / 2;
    // 径向渐变模拟发光，中心白热 -> 中间色 -> 边缘透明
    var g = sx.createRadialGradient(cx, cx, 0, cx, cx, cx);
    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(0.15, color);
    g.addColorStop(0.5, color);
    g.addColorStop(1, "rgba(0,0,0,0)");
    sx.fillStyle = g;
    sx.fillRect(0, 0, SPRITE_SIZE, SPRITE_SIZE);
    spriteCache[color] = s;
    return s;
  }

  // 预生成常用颜色精灵
  var COLORS = [
    "#ff3d77","#ff6b9d","#ff8fb1","#ffb3d1",
    "#c490ff","#9b5de5","#e0b0ff",
    "#ffd36e","#ff9a3c","#ffab7a",
    "#8ad7ff","#48cae4",
    "#7be0ad","#52c41a","#a8e6cf",
    "#ff5d8f","#ff6b6b","#ff9a9e",
    "#c77dff","#e0a3ff"
  ];
  COLORS.forEach(function(c){ getSprite(c); });

  /* ═════════ 音频 ═════════ */
  var audioCtx = null;
  function initAudio(){
    if(audioCtx) return;
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  }
  function tone(freq, vol, delay, dur, type){
    if(!audioCtx) return;
    var t = audioCtx.currentTime + (delay||0);
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type||"sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol||0.08, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur||0.5));
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + (dur||0.5) + 0.05);
  }
  function sndExplode(){
    if(!audioCtx) return;
    var f = 350 + Math.random()*200;
    tone(f, 0.1, 0, 0.4, "triangle");
    tone(f*1.5, 0.06, 0.04, 0.3, "sine");
    // 高频闪光声
    for(var i=0;i<3;i++) tone(1200+Math.random()*800, 0.03, i*0.03, 0.1, "sine");
  }
  function sndWhoosh(){
    if(!audioCtx) return;
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(180, t);
    o.frequency.exponentialRampToValueAtTime(500, t+0.35);
    var f = audioCtx.createBiquadFilter();
    f.type = "lowpass"; f.frequency.value = 700;
    g.gain.setValueAtTime(0.015, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.35);
    o.connect(f); f.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t+0.4);
  }

  /* ═════════ 背景星群（静态 canvas 预渲染） ═════════ */
  var starCanvas, starCtx;
  function buildStars(){
    starCanvas = document.createElement("canvas");
    starCanvas.width = W * DPR; starCanvas.height = H * DPR;
    starCtx = starCanvas.getContext("2d");
    starCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var n = Math.floor(W * H / 5000);
    for(var i=0;i<n;i++){
      var x = Math.random()*W, y = Math.random()*H;
      var r = 0.3 + Math.random()*1.3;
      var a = 0.2 + Math.random()*0.6;
      starCtx.globalAlpha = a;
      starCtx.beginPath();
      starCtx.arc(x, y, r, 0, Math.PI*2);
      starCtx.fillStyle = "#ffffff";
      starCtx.fill();
      if(r > 0.9){
        starCtx.globalAlpha = a * 0.1;
        starCtx.strokeStyle = "#ffffff";
        starCtx.lineWidth = 0.5;
        starCtx.beginPath();
        starCtx.moveTo(x - r*4, y); starCtx.lineTo(x + r*4, y);
        starCtx.moveTo(x, y - r*4); starCtx.lineTo(x, y + r*4);
        starCtx.stroke();
      }
    }
    starCtx.globalAlpha = 1;
  }
  buildStars();

  /* ═════════ 烟花数据 ═════════ */
  var rockets = [];
  var particles = [];
  var launchCount = 0;

  function heartPoints(n){
    var pts = [];
    for(var i=0;i<n;i++){
      var t = (i/n) * Math.PI * 2;
      var x = 16 * Math.pow(Math.sin(t), 3);
      var y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
      pts.push({ x: x/16, y: -y/16 });
    }
    return pts;
  }

  var LOVELY_TEXT = [
    "这封信，烟火替我读给你听",
    "你一来，满城灯火都有了意义",
    "烟火落尽，我还在这里等你",
    "与你并肩的黄昏，都值得纪念",
    "岁月漫长，而你是唯一的近路",
    "风穿过人海，替我向你问好",
    "把日子过成诗，诗里全是你",
    "山河远阔，人间烟火，皆是你",
    "爱意是炉火，不是烟花，慢慢热",
    "你往这一站，风都变温柔",
    "我想见的春天，正好是你",
    "世界很大，我想带你看完",
    "晚安之前，先想你一遍",
    "我所有的形容词，都用来写你",
    "兜兜转转，还是想遇见你"
  ];

  function launchRocket(x, targetY, type){
    type = type || "normal";
    rockets.push({
      x: x, y: H + 10,
      vx: (Math.random()-0.5) * 0.8,
      vy: -(5 + Math.random()*2),
      targetY: targetY,
      type: type
    });
    sndWhoosh();
  }

  function explode(rx, ry, type){
    sndExplode();

    var count, pts, power, colorList;
    if(type === "mega"){
      count = 100; power = 5.5;
      pts = heartPoints(count);
      colorList = ["#ff3d77","#ff6b9d","#c490ff","#ffd36e","#8ad7ff"];
    } else if(type === "heart"){
      count = 70; power = 4.5;
      pts = heartPoints(count);
      colorList = ["#ff3d77","#ff6b9d","#ff8fb1","#ff5d8f"];
    } else {
      count = 50 + Math.floor(Math.random()*20);
      power = 3.5 + Math.random()*1.5;
      pts = [];
      for(var i=0;i<count;i++){
        var ang = (i/count)*Math.PI*2 + Math.random()*0.15;
        var spd = 0.7 + Math.random()*0.5;
        pts.push({ x:Math.cos(ang)*spd, y:Math.sin(ang)*spd });
      }
      // 每次普通爆炸选一个色系
      var palettes = [
        ["#ff3d77","#ff6b9d","#ff8fb1"],
        ["#c490ff","#9b5de5","#e0b0ff"],
        ["#ffd36e","#ff9a3c","#ffab7a"],
        ["#8ad7ff","#48cae4","#b5e5ff"],
        ["#7be0ad","#52c41a","#a8e6cf"],
        ["#ff5d8f","#ff6b6b","#ff9a9e"]
      ];
      colorList = palettes[Math.floor(Math.random()*palettes.length)];
    }

    for(var i=0;i<pts.length;i++){
      var p = pts[i];
      var spd = power * (0.8 + Math.random()*0.4);
      particles.push({
        x: rx, y: ry,
        vx: p.x * spd,
        vy: p.y * spd,
        grav: 0.04 + Math.random()*0.015,
        drag: 0.986,
        size: type === "mega" ? (10 + Math.random()*8) : (7 + Math.random()*6),
        life: 70 + Math.random()*30,
        maxLife: 100,
        color: colorList[Math.floor(Math.random()*colorList.length)]
      });
    }

    // 中心白色闪光
    for(var k=0;k<8;k++){
      var ang2 = Math.random()*Math.PI*2;
      var spd2 = 1 + Math.random()*4;
      particles.push({
        x: rx, y: ry,
        vx: Math.cos(ang2)*spd2, vy: Math.sin(ang2)*spd2 - 2,
        grav: 0.02, drag: 0.97,
        size: 12 + Math.random()*8,
        life: 12 + Math.random()*8, maxLife: 20,
        color: "#ffffff"
      });
    }
  }

  function showLoveMsg(x, y){
    var msg = LOVELY_TEXT[Math.floor(Math.random()*LOVELY_TEXT.length)];
    var el = document.createElement("div");
    el.className = "love-msg";
    el.textContent = msg;
    el.style.left = Math.max(130, Math.min(W-130, x)) + "px";
    el.style.top = Math.max(50, y - 30) + "px";
    el.style.fontSize = "clamp(16px,4.5vw,26px)";
    el.style.color = "#ffd1e3";
    el.style.textShadow = "0 0 24px rgba(255,100,150,.4), 0 0 60px rgba(200,80,180,.2)";
    document.body.appendChild(el);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ el.classList.add("show"); });
    });
    setTimeout(function(){ el.classList.remove("show"); el.classList.add("fade"); }, 2800);
    setTimeout(function(){ el.remove(); }, 5000);
  }

  /* ═════════ 主循环 ═════════ */
  function update(){
    // 火箭
    for(var i=rockets.length-1;i>=0;i--){
      var r = rockets[i];
      r.x += r.vx; r.y += r.vy; r.vy += 0.035;
      if(r.y <= r.targetY || r.vy >= -0.5){
        explode(r.x, r.y, r.type);
        rockets.splice(i, 1);
      }
    }

    // 粒子
    for(var i=particles.length-1;i>=0;i--){
      var p = particles[i];
      p.life--;
      if(p.life <= 0){ particles.splice(i, 1); continue; }
      p.vx *= p.drag; p.vy *= p.drag;
      p.vy += p.grav;
      p.x += p.vx; p.y += p.vy;
    }
  }

  function draw(){
    // 半透明清屏 = 拖影残像（不依赖每粒子的trail数组）
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(5,5,16,0.2)";
    ctx.fillRect(0, 0, W, H);

    // 背景星空（直接 drawImage 预渲染层）
    ctx.globalCompositeOperation = "lighter";
    ctx.drawImage(starCanvas, 0, 0, W, H);

    // 火箭头 + 尾焰
    for(var i=0;i<rockets.length;i++){
      var r = rockets[i];
      // 尾焰用渐变线段，比多个 arc 快得多
      var tailY = r.y + 18;
      var grad = ctx.createLinearGradient(r.x, r.y, r.x, tailY);
      grad.addColorStop(0, "rgba(255,220,160,0.8)");
      grad.addColorStop(1, "rgba(255,180,100,0)");
      ctx.strokeStyle = grad;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(r.x, r.y);
      ctx.lineTo(r.x, tailY);
      ctx.stroke();
      // 头部光点
      var sp = getSprite("#ffddaa");
      ctx.drawImage(sp, r.x - 8, r.y - 8, 16, 16);
    }

    // 粒子 - 全部 drawImage，零 shadowBlur
    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      var lr = p.life / p.maxLife;
      var alpha = lr > 0.7 ? 1 : (lr * 1.4);
      ctx.globalAlpha = Math.min(1, alpha);
      var sz = p.size * (lr > 0.5 ? 1 : lr * 2);
      var sp = getSprite(p.color);
      ctx.drawImage(sp, p.x - sz/2, p.y - sz/2, sz, sz);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  function loop(){
    update(); draw();
    requestAnimationFrame(loop);
  }

  /* ═════════ 交互 ═════════ */
  function onLaunch(x, y){
    initAudio();
    var targetY = y < H * 0.45 ? y : (60 + Math.random() * H * 0.3);
    launchCount++;
    document.getElementById("countNum").textContent = launchCount;
    document.getElementById("counter").classList.add("show");
    document.getElementById("hint").classList.add("gone");

    var type = "normal";
    if(launchCount % 5 === 0) type = "heart";
    if(launchCount % 10 === 0) type = "mega";

    launchRocket(x, targetY, type);

    if(type !== "normal"){
      setTimeout(function(){ showLoveMsg(x, targetY); }, 500);
    }
  }

  canvas.addEventListener("pointerdown", function(e){
    onLaunch(e.clientX, e.clientY);
  });

  document.addEventListener("keydown", function(e){
    if(e.key === " " || e.key === "Enter"){
      e.preventDefault();
      onLaunch(W/2 + (Math.random()-0.5)*W*0.5, 60 + Math.random()*H*0.3);
    }
  });

  /* ═════════ 自动播放 ═════════ */
  var lastInteract = Date.now();
  function autoPlay(){
    if(Date.now() - lastInteract > 5000){
      var x = 80 + Math.random()*(W-160);
      var y = 50 + Math.random()*H*0.35;
      launchCount++;
      document.getElementById("countNum").textContent = launchCount;
      document.getElementById("counter").classList.add("show");
      var t = "normal";
      if(launchCount % 5 === 0) t = "heart";
      if(launchCount % 10 === 0) t = "mega";
      launchRocket(x, y, t);
      if(t !== "normal") setTimeout(function(){ showLoveMsg(x, y); }, 500);
    }
    setTimeout(autoPlay, 1500 + Math.random()*1500);
  }
  setTimeout(autoPlay, 4000);

  canvas.addEventListener("pointerdown", function(){ lastInteract = Date.now(); });
  document.addEventListener("keydown", function(){ lastInteract = Date.now(); });

  /* ═════════ 开场齐发 ═════════ */
  // 无遮罩，直接进场后来一波烟花
  setTimeout(function(){
    initAudio();
    var pos = [[0.25,0.28],[0.5,0.2],[0.75,0.3]];
    pos.forEach(function(p, i){
      setTimeout(function(){
        launchRocket(W*p[0], H*p[1], i===2 ? "heart" : "normal");
      }, i * 600);
    });
    setTimeout(function(){ showLoveMsg(W*0.5, H*0.2); }, 2500);
    lastInteract = Date.now() + 8000;
  }, 800);

  /* ═════════ resize ═════════ */
  window.addEventListener("resize", function(){
    resize(); buildStars();
  });

  loop();
})();
</script>
</body>
</html>
