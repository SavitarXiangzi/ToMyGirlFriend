<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070818">
<title>♡ 七夕 · 鹊桥相会</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Long+Cang&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#070818; --night2:#101530;
    --gold:#ffd98a; --pink:#ff9ec4;
    --text:#e8edff; --text2:#aab2d6;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ scroll-snap-type:y mandatory; scroll-behavior:smooth; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--night);
    color:var(--text);
    font-family:"Ma Shan Zheng","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    overflow-x:hidden;
    overscroll-behavior-y:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }

  /* ── 两层画布：bg 静态星空银河 / fx 鹊桥互动 ── */
  #bg,#fx{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  #bg{ z-index:0; }
  #fx{ z-index:5; pointer-events:none; }

  .back-btn{
    position:fixed; top:calc(env(safe-area-inset-top)+16px); left:16px; z-index:50;
    width:44px; height:44px; border-radius:50%;
    border:1px solid rgba(232,237,255,.22);
    background:rgba(232,237,255,.06);
    color:var(--text); font-size:21px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; text-decoration:none; backdrop-filter:blur(8px);
    transition:all .25s ease;
  }
  .back-btn:hover{ background:rgba(232,237,255,.16); border-color:rgba(255,217,138,.45); color:#fff; }
  .back-btn:active{ transform:scale(.9); }

  main{ position:relative; z-index:10; }

  /* ── 五屏长卷 ── */
  .scene{
    position:relative;
    min-height:100vh; min-height:100dvh;
    scroll-snap-align:start; scroll-snap-stop:always;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:calc(env(safe-area-inset-top) + 34px) 26px calc(env(safe-area-inset-bottom) + 34px);
  }
  .block{ max-width:min(86vw, 620px); }

  /* 入场浮现 */
  .rv{
    opacity:0; transform:translateY(26px); filter:blur(4px);
    transition:opacity .9s ease, transform .9s ease, filter .9s ease;
  }
  .scene.on .rv{ opacity:1; transform:none; filter:none; }
  .scene.on .rv.d1{ transition-delay:.18s; }
  .scene.on .rv.d2{ transition-delay:.36s; }
  .scene.on .rv.d3{ transition-delay:.54s; }

  /* ── 文字元素 ── */
  .kicker{
    display:flex; align-items:center; gap:14px; justify-content:center;
    color:var(--gold); font-size:clamp(15px,4.2vw,18px);
    letter-spacing:.32em; text-indent:.32em; opacity:.92;
    margin:0 0 14px;
  }
  .kicker::before,.kicker::after{
    content:''; width:34px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,217,138,.6));
  }
  .kicker::after{ background:linear-gradient(90deg, rgba(255,217,138,.6), transparent); }

  .poem{
    font-family:"Long Cang","PingFang SC","Microsoft YaHei",cursive;
    font-size:clamp(19px,5.4vw,32px);
    line-height:2; letter-spacing:.14em;
    color:var(--text);
    margin:0;
    text-shadow:0 0 18px rgba(120,160,255,.35), 0 6px 22px rgba(0,0,0,.4);
  }
  .poem .hl{ color:var(--gold); text-shadow:0 0 18px rgba(255,217,138,.4); }

  /* 第 2 屏诗句沉到下三分之一，避开双星与星名 */
  #s2 .block{ margin-top:auto; margin-bottom:calc(env(safe-area-inset-bottom) + 11vh); }
  /* 第 4 屏文字下移，避开拱桥与相会光效 */
  #s4 .block{ margin-top:13vh; }

  /* 第 1 屏 · 引子 */
  .s1-title{
    margin:0 0 14px;
    font-size:clamp(30px,8.8vw,58px);
    letter-spacing:.08em; white-space:nowrap;
    text-shadow:0 0 26px rgba(120,160,255,.4), 0 10px 28px rgba(0,0,0,.4);
    animation:titleFloat 3.4s ease-in-out infinite;
  }
  @keyframes titleFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-7px); } }
  .s1-title .heart{ display:inline-block; color:var(--pink); animation:beat 1.5s ease-in-out infinite; }
  @keyframes beat{
    0%,100%{ transform:scale(1); }
    12%{ transform:scale(1.22); }
    24%{ transform:scale(1); }
    36%{ transform:scale(1.1); }
    48%{ transform:scale(1); }
  }
  .s1-sub{
    font-family:"Long Cang","PingFang SC","Microsoft YaHei",cursive;
    margin:0; color:var(--gold);
    font-size:clamp(18px,5.4vw,24px); letter-spacing:.18em;
    text-shadow:0 0 16px rgba(255,217,138,.3);
  }
  .s1-hint{
    position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom) + 30px);
    transform:translateX(-50%);
    margin:0; white-space:nowrap;
    color:rgba(232,237,255,.6); font-size:clamp(13px,3.8vw,15px); letter-spacing:.22em;
    animation:hintPulse 2.2s ease-in-out infinite;
  }
  @keyframes hintPulse{
    0%,100%{ opacity:.35; transform:translateX(-50%) translateY(0); }
    50%{ opacity:.9; transform:translateX(-50%) translateY(6px); }
  }

  /* 第 3 屏 · 唤鹊 */
  .s3-note{
    margin:4px 0 0; color:var(--text2);
    font-size:clamp(14px,4vw,17px); letter-spacing:.12em;
  }
  .chip{
    display:inline-block; margin-top:22px;
    padding:9px 22px; border-radius:999px;
    border:1px solid rgba(255,217,138,.35);
    background:rgba(16,21,48,.5); backdrop-filter:blur(8px);
    color:var(--text); font-size:clamp(14px,4vw,17px); letter-spacing:.1em;
    transition:border-color .4s ease, box-shadow .4s ease, color .4s ease;
  }
  .chip b{ color:var(--gold); font-size:1.15em; padding:0 2px; }
  .chip.done{
    border-color:rgba(255,158,196,.6);
    box-shadow:0 0 22px rgba(255,158,196,.25);
    color:var(--pink);
  }
  .chip.done b{ color:var(--pink); }

  /* 第 4 屏 · 相会诗句（相会后浮现） */
  .s4-poem{
    opacity:0; transform:translateY(20px);
    transition:opacity 1.1s ease .25s, transform 1.1s ease .25s;
  }
  #s4.met .s4-poem{ opacity:1; transform:none; }

  /* 第 5 屏 · 结尾卡片 */
  .end-card{
    position:relative;
    max-width:min(88vw, 430px);
    padding:clamp(28px,6vw,40px) clamp(22px,5vw,36px);
    border-radius:22px;
    border:1px solid rgba(232,237,255,.16);
    background:rgba(16,21,48,.52);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 18px 50px rgba(0,0,0,.4), 0 0 40px rgba(120,160,255,.08);
    overflow:hidden;
  }
  .end-card::before{
    content:''; position:absolute; inset:0;
    background:radial-gradient(120% 90% at 50% -20%, rgba(255,158,196,.12), transparent 55%);
    pointer-events:none;
  }
  .end-lead{
    margin:0 0 6px; color:var(--text2);
    font-size:clamp(14px,3.9vw,16px); letter-spacing:.12em;
  }
  .end-lead2{
    margin:0 0 20px;
    font-family:"Long Cang","PingFang SC","Microsoft YaHei",cursive;
    color:var(--text); font-size:clamp(19px,5.6vw,24px); letter-spacing:.1em;
  }
  .end-big{
    margin:0 0 6px;
    font-size:clamp(38px,10.5vw,54px); letter-spacing:.06em;
    color:var(--gold);
    text-shadow:0 0 26px rgba(255,217,138,.35);
  }
  .end-big b{ font-size:1.18em; padding:0 4px; }
  .end-sub{
    margin:0 0 20px; color:var(--pink);
    font-size:clamp(16px,4.6vw,19px); letter-spacing:.1em;
    text-shadow:0 0 16px rgba(255,158,196,.3);
  }
  .qixi-chip{
    display:inline-block;
    padding:8px 18px; border-radius:999px;
    border:1px solid rgba(255,217,138,.3);
    color:var(--text2); font-size:clamp(13px,3.6vw,14.5px); letter-spacing:.08em;
  }
  .qixi-chip b{ color:var(--gold); padding:0 2px; }

  .footer{
    margin-top:30px; margin-bottom:0;
    color:var(--text2); opacity:.65;
    font-size:clamp(12px,3.2vw,14px); letter-spacing:.1em;
  }
  .footer .heart{ display:inline-block; color:var(--pink); animation:beat 1.4s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    .s1-title,.s1-title .heart,.s1-hint,.footer .heart{ animation:none; }
    .rv,.s4-poem{ transition-duration:.01s; }
  }
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<a class="back-btn" href="index.html" aria-label="返回主页">←</a>

<main>

  <!-- 第 1 屏 · 引子 -->
  <section class="scene" id="s1">
    <div class="block">
      <h1 class="s1-title rv">七夕 <span class="heart">♡</span> 鹊桥相会</h1>
      <p class="s1-sub rv d1">纤云弄巧 · 飞星传恨<br>银汉迢迢暗度</p>
    </div>
    <p class="s1-hint">向下滑动 ↓</p>
  </section>

  <!-- 第 2 屏 · 银河相望 -->
  <section class="scene" id="s2">
    <div class="block">
      <p class="kicker rv">银河相望</p>
      <p class="poem rv d1">迢迢牵牛星，皎皎河汉女<br>盈盈一水间，<span class="hl">脉脉不得语</span></p>
    </div>
  </section>

  <!-- 第 3 屏 · 唤鹊搭桥 -->
  <section class="scene" id="s3">
    <div class="block">
      <p class="kicker rv">唤鹊搭桥</p>
      <p class="s3-note rv d1">轻点夜空，唤来喜鹊</p>
      <p class="chip rv d2" id="qChip">已唤来 <b id="qCount">0</b> / 7 只喜鹊</p>
    </div>
  </section>

  <!-- 第 4 屏 · 鹊桥相会 -->
  <section class="scene" id="s4">
    <div class="block">
      <p class="kicker rv">鹊桥相会</p>
      <p class="poem s4-poem" id="s4Poem">金风玉露一相逢<br><span class="hl">便胜却人间无数</span></p>
    </div>
  </section>

  <!-- 第 5 屏 · 我们的故事 -->
  <section class="scene" id="s5">
    <div class="block">
      <div class="end-card rv">
        <p class="end-lead">一年一会，是属于星河的传说</p>
        <p class="end-lead2">天天相伴，<br>才是我们的答案</p>
        <p class="end-big">在一起 <b id="dLove">—</b> 天</p>
        <p class="end-sub">相识 <span id="dKnow">—</span> 天 ♡</p>
        <p class="qixi-chip" id="qixiChip">✦ 距下一次七夕还有 <b id="dQixi">—</b> 天</p>
      </div>
      <p class="footer rv d1">Made with <span class="heart">♥</span> for you</p>
    </div>
  </section>

</main>

<script>
(function(){
"use strict";

/* ================= 工具 ================= */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rand(a,b){ return a + Math.random()*(b-a); }
function easeInOut(p){ return p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2; }

var bgCanvas = document.getElementById("bg");
var bg = bgCanvas.getContext("2d");
var fxCanvas = document.getElementById("fx");
var fx = fxCanvas.getContext("2d");
var W=0, H=0, DPR=1;

/* ================= 背景：静态星图（离屏预渲染） ================= */
var starCanvas = null;
function buildStars(){
  starCanvas = document.createElement("canvas");
  starCanvas.width = bgCanvas.width;
  starCanvas.height = bgCanvas.height;
  var g = starCanvas.getContext("2d");
  g.setTransform(DPR,0,0,DPR,0,0);
  var n = Math.floor(W*H/4200);
  for(var i=0;i<n;i++){
    var x=Math.random()*W, y=Math.random()*H;
    var r=0.25+Math.random()*1.3, a=0.18+Math.random()*0.75;
    g.globalAlpha=a;
    g.beginPath();
    g.arc(x,y,r,0,Math.PI*2);
    g.fillStyle = Math.random()<0.12 ? "#ffd98a" : "#ffffff";
    g.fill();
  }
  g.globalAlpha=1;
}

/* ================= 背景：银河带 ================= */
function drawMilkyWay(t){
  var g = bg.createLinearGradient(0,H*0.1,0,H*0.9);
  g.addColorStop(0,"rgba(255,255,255,0)");
  g.addColorStop(0.35,"rgba(140,170,255,0.12)");
  g.addColorStop(0.5,"rgba(255,215,240,0.16)");
  g.addColorStop(0.65,"rgba(140,170,255,0.10)");
  g.addColorStop(1,"rgba(255,255,255,0)");
  bg.save();
  bg.globalCompositeOperation="lighter";
  bg.strokeStyle=g; bg.lineCap="round";
  var step=12;
  bg.lineWidth=H*0.16;
  bg.beginPath();
  for(var x=-50;x<=W+50;x+=step){
    var y=H*0.46 + Math.sin(x*0.006+t*0.22)*H*0.03 + Math.sin(x*0.014-t*0.14)*H*0.016;
    if(x===-50){ bg.moveTo(x,y); } else { bg.lineTo(x,y); }
  }
  bg.stroke();
  bg.lineWidth=H*0.045;
  bg.strokeStyle="rgba(255,255,255,.055)";
  bg.beginPath();
  for(var x2=-50;x2<=W+50;x2+=step){
    var y2=H*0.46 + Math.sin(x2*0.006+t*0.22)*H*0.03 + Math.sin(x2*0.014-t*0.14)*H*0.016;
    if(x2===-50){ bg.moveTo(x2,y2); } else { bg.lineTo(x2,y2); }
  }
  bg.stroke();
  bg.restore();
}

/* ================= 背景：流星 ================= */
var meteors=[];
function spawnMeteor(){
  meteors.push({
    x:W*0.15+Math.random()*W*0.7,
    y:H*0.05+Math.random()*H*0.25,
    vx:5+Math.random()*3, vy:2.2+Math.random()*1.3,
    life:1
  });
}
var meteorTimer=null;
function scheduleMeteor(){
  var gap = (story.phase==="met" && performance.now()-story.metAt<9000) ? rand(900,1800) : rand(3200,6800);
  meteorTimer=setTimeout(function(){
    spawnMeteor();
    scheduleMeteor();
  }, gap);
}
function drawMeteors(){
  for(var i=meteors.length-1;i>=0;i--){
    var m=meteors[i];
    m.x+=m.vx; m.y+=m.vy; m.life-=0.018;
    if(m.life<=0){ meteors.splice(i,1); continue; }
    var tx=m.x-m.vx*10, ty=m.y-m.vy*10;
    var g=bg.createLinearGradient(tx,ty,m.x,m.y);
    g.addColorStop(0,"rgba(255,255,255,0)");
    g.addColorStop(1,"rgba(255,255,255,"+(m.life*0.85).toFixed(2)+")");
    bg.globalCompositeOperation="lighter";
    bg.strokeStyle=g; bg.lineWidth=1.6; bg.lineCap="round";
    bg.beginPath(); bg.moveTo(tx,ty); bg.lineTo(m.x,m.y); bg.stroke();
    bg.globalCompositeOperation="source-over";
  }
}

/* ================= 几何：双星 / 鹊桥 ================= */
function starPos(){
  return {
    l:{ x:W*0.20, y:H*0.42 },
    r:{ x:W*0.80, y:H*0.42 }
  };
}
function bridgeCtrl(){
  var p=starPos();
  return { x:(p.l.x+p.r.x)/2, y:p.l.y - H*0.20 };
}
function qPoint(p0,p1,p2,t){
  var u=1-t;
  return { x:u*u*p0.x+2*u*t*p1.x+t*t*p2.x, y:u*u*p0.y+2*u*t*p1.y+t*t*p2.y };
}
function qTangent(p0,p1,p2,t){
  return { x:2*(1-t)*(p1.x-p0.x)+2*t*(p2.x-p1.x), y:2*(1-t)*(p1.y-p0.y)+2*t*(p2.y-p1.y) };
}
function circleCenter(){
  return { x:W/2, y:H*0.42 - H*0.10 };
}
function circleR(){
  return Math.min(W*0.24, 170);
}

/* ================= 精灵：光晕 ================= */
var glowSprite=null;
function getGlow(){
  if(glowSprite) return glowSprite;
  glowSprite=document.createElement("canvas");
  glowSprite.width=glowSprite.height=96;
  var g=glowSprite.getContext("2d");
  var c=48;
  var grad=g.createRadialGradient(c,c,0,c,c,c);
  grad.addColorStop(0,"rgba(255,240,180,0.95)");
  grad.addColorStop(0.25,"rgba(255,170,80,0.45)");
  grad.addColorStop(1,"rgba(255,100,50,0)");
  g.fillStyle=grad;
  g.fillRect(0,0,96,96);
  return glowSprite;
}

/* ================= 绘制：亮星 ================= */
function drawGlowAt(g,x,y,radius,color,alpha){
  var grad=g.createRadialGradient(x,y,0,x,y,radius);
  grad.addColorStop(0,color);
  grad.addColorStop(1,"rgba(0,0,0,0)");
  g.globalCompositeOperation="lighter";
  g.globalAlpha=alpha;
  g.fillStyle=grad;
  g.beginPath(); g.arc(x,y,radius,0,Math.PI*2); g.fill();
  g.globalAlpha=1;
  g.globalCompositeOperation="source-over";
}
function drawBrightStar(g,x,y,r,color,tw){
  var r2=r*(0.92+0.14*Math.sin(tw));
  drawGlowAt(g,x,y,r2*7,color,0.8);
  g.save();
  g.translate(x,y);
  g.fillStyle=color;
  g.beginPath(); g.arc(0,0,r2,0,Math.PI*2); g.fill();
  g.strokeStyle="rgba(255,255,255,.6)";
  g.lineWidth=0.8;
  var l=r2*4.2*(0.9+0.18*Math.sin(tw*1.3));
  g.beginPath();
  g.moveTo(-l,0); g.lineTo(l,0);
  g.moveTo(0,-l); g.lineTo(0,l);
  g.stroke();
  g.restore();
}

/* ================= 绘制：喜鹊 ================= */
function drawMagpie(g,x,y,ang,s,flap,flip){
  g.save();
  g.translate(x,y);
  g.rotate(ang);
  if(flip){ g.scale(1,-1); }
  g.scale(s,s);
  g.lineJoin="round"; g.lineCap="round";

  /* 长尾 */
  var sway=flap*1.6;
  g.strokeStyle="#232a52"; g.lineWidth=2.4;
  g.beginPath();
  g.moveTo(-4,0);
  g.quadraticCurveTo(-10,-1+sway,-16,-1.5+sway*1.5);
  g.stroke();
  g.lineWidth=1.5; g.strokeStyle="#2e3768";
  g.beginPath();
  g.moveTo(-4,1);
  g.quadraticCurveTo(-10,1.5+sway*0.6,-14.5,3+sway);
  g.stroke();

  /* 身体 */
  g.fillStyle="#141a3a";
  g.beginPath(); g.ellipse(0,0,7.6,4,0,0,Math.PI*2); g.fill();
  /* 白腹 */
  g.fillStyle="#eef1fb";
  g.beginPath(); g.ellipse(1.6,1.5,4.6,2.1,0,0,Math.PI*2); g.fill();
  /* 白肩 */
  g.fillStyle="#cfd6ef";
  g.beginPath(); g.ellipse(-2.6,-1.3,3.1,1.5,0.3,0,Math.PI*2); g.fill();

  /* 头与喙 */
  g.fillStyle="#10142e";
  g.beginPath(); g.arc(6.3,-2.8,2.9,0,Math.PI*2); g.fill();
  g.fillStyle="#ffc46e";
  g.beginPath();
  g.moveTo(8.7,-3.1); g.lineTo(11.2,-2.3); g.lineTo(8.5,-1.6);
  g.closePath(); g.fill();
  g.fillStyle="#ffffff";
  g.beginPath(); g.arc(7,-3.6,0.55,0,Math.PI*2); g.fill();

  /* 振翅 */
  var wing=-3-flap*4.5;
  g.strokeStyle="#1b2246"; g.lineWidth=2.5;
  g.beginPath();
  g.moveTo(0.5,-2);
  g.quadraticCurveTo(-2,wing-3,-9,wing-2);
  g.stroke();
  g.strokeStyle="#39427a"; g.lineWidth=1.4;
  g.beginPath();
  g.moveTo(1.5,-2);
  g.quadraticCurveTo(-0.5,wing-1,-7,wing);
  g.stroke();
  g.restore();
}

/* ================= 状态机 ================= */
var NEED = 7;
var story = {
  idx: 0,            /* 当前屏 */
  phase: "idle",     /* idle → stars → gather → bridge → meet → met */
  magpies: [],
  arrived: 0,
  lastManual: 0,
  lastAuto: 0,
  bridgeStart: 0,
  meetStart: 0,
  metAt: 0,
  lanterns: [],
  lastLantern: 0
};

function spawnMagpie(sx,sy){
  if(story.magpies.length>=NEED) return false;
  var a0=Math.random()*Math.PI*2;
  var c=circleCenter(), R=circleR();
  var mag={
    state:"in",
    x:sx, y:sy,
    a:a0, dir:Math.random()<0.5?1:-1,
    spd:rand(0.0009,0.0014),
    flap:Math.random()*Math.PI*2, bob:Math.random()*Math.PI*2,
    tx:c.x+Math.cos(a0)*R, ty:c.y+Math.sin(a0)*R,
    slot:-1, sx:0, sy:0, st:0, dur:1300, delay:0
  };
  story.magpies.push(mag);
  return true;
}
function spawnEdgeMagpie(){
  var side=Math.random();
  var sx, sy;
  if(side<0.35){ sx=rand(-30,W*0.2); sy=rand(H*0.05,H*0.3); }
  else if(side<0.7){ sx=rand(W*0.8,W+30); sy=rand(H*0.05,H*0.3); }
  else { sx=rand(W*0.3,W*0.7); sy=-30; }
  spawnMagpie(sx,sy);
}
function updateChip(){
  var n=story.arrived;
  var cnt=document.getElementById("qCount");
  var chip=document.getElementById("qChip");
  cnt.textContent=n;
  if(n>=NEED){
    chip.classList.add("done");
    chip.innerHTML="鹊群已聚齐 · 向下滑动，看他们相会 ♡";
  }
}

/* 相会高潮 */
function burst(){
  var m=qPoint(starPos().l,bridgeCtrl(),starPos().r,0.5);
  story.lanterns.length=0;
  for(var i=0;i<24;i++){
    story.lanterns.push(makeLantern(
      rand(W*0.05,W*0.95),
      H+rand(10,120),
      rand(0,1900)
    ));
  }
  for(var j=0;j<6;j++){
    story.lanterns.push(makeLantern(
      m.x+rand(-60,60), m.y+rand(-30,40), rand(100,900)
    ));
  }
}
function makeLantern(x,y,delay){
  return {
    x:x, y:y, delay:delay,
    vx:rand(-0.12,0.12), vy:-rand(0.35,0.7),
    phase:Math.random()*Math.PI*2,
    size:rand(13,24), life:1,
    decay:rand(0.0012,0.002)
  };
}
function drawLantern(l,now){
  if(l.delay>0) return;
  var sx=l.x+Math.sin(l.phase+now*0.001)*4;
  var s=l.size;
  fx.globalCompositeOperation="lighter";
  fx.globalAlpha=Math.max(0,l.life)*0.85;
  fx.drawImage(getGlow(),sx-s*2.4,l.y-s*2.4,s*4.8,s*4.8);
  fx.globalCompositeOperation="source-over";
  fx.globalAlpha=Math.max(0,l.life);
  fx.save();
  fx.translate(sx,l.y);
  fx.strokeStyle="rgba(40,22,12,.75)"; fx.lineWidth=1;
  fx.beginPath(); fx.moveTo(0,-s*0.72); fx.lineTo(0,-s*1.05); fx.stroke();
  var grad=fx.createLinearGradient(-s*0.7,0,s*0.7,0);
  grad.addColorStop(0,"#ff9a3c"); grad.addColorStop(0.5,"#ffd98a"); grad.addColorStop(1,"#ff9a3c");
  fx.fillStyle=grad;
  fx.beginPath(); fx.ellipse(0,0,s*0.7,s*0.78,0,0,Math.PI*2); fx.fill();
  fx.strokeStyle="rgba(120,45,20,.7)"; fx.lineWidth=1.1;
  fx.beginPath();
  fx.moveTo(-s*0.55,-s*0.48); fx.lineTo(s*0.55,-s*0.48);
  fx.moveTo(-s*0.58,s*0.42); fx.lineTo(s*0.58,s*0.42);
  fx.stroke();
  fx.fillStyle="#fff3cf";
  fx.font=(s*0.62)+"px 'Ma Shan Zheng','PingFang SC',sans-serif";
  fx.textAlign="center"; fx.textBaseline="middle";
  fx.fillText("愿",0,1);
  fx.restore();
  fx.globalAlpha=1;
}

/* 心形（相会爆发） */
function drawHeart(g,x,y,s,color,alpha){
  g.save();
  g.translate(x,y);
  g.scale(s/16,s/16);
  g.globalAlpha=alpha;
  g.fillStyle=color;
  g.shadowColor=color; g.shadowBlur=30;
  g.beginPath();
  for(var t=0;t<=Math.PI*2+0.05;t+=0.08){
    var px=16*Math.pow(Math.sin(t),3);
    var py=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    if(t===0){ g.moveTo(px,py); } else { g.lineTo(px,py); }
  }
  g.closePath();
  g.fill();
  g.restore();
  g.globalAlpha=1;
}

/* ================= 滚动驱动 ================= */
/* 叙事长卷：刷新后总是从第 1 屏开始，避免中途恢复滚动位置把剧情直接跳完 */
if("scrollRestoration" in history){ history.scrollRestoration="manual"; }
window.scrollTo(0,0);
window.addEventListener("load",function(){ window.scrollTo(0,0); });
window.addEventListener("pageshow",function(e){ if(e.persisted) window.scrollTo(0,0); });

var scenes=[document.getElementById("s1"),document.getElementById("s2"),document.getElementById("s3"),document.getElementById("s4"),document.getElementById("s5")];
var seqStarted=false;

function setIdx(i){
  if(i===story.idx && scenes[i].classList.contains("on")) return;
  story.idx=i;
  for(var k=0;k<scenes.length;k++){
    scenes[k].classList.toggle("on",k<=i || scenes[k].classList.contains("met"));
  }
  advancePhase();
}
function advancePhase(){
  var i=story.idx;
  if(i>=1 && story.phase==="idle") story.phase="stars";
  if(i===2 && story.phase==="stars") story.phase="gather";
  if(i>=3 && !seqStarted) startSequence();
}
function startSequence(){
  seqStarted=true;
  story.phase="bridge";
  story.bridgeStart=performance.now();
  /* 剧情已推进到搭桥，计数徽章定格为完成态 */
  document.getElementById("qChip").classList.add("done");
  document.getElementById("qChip").innerHTML="鹊群已聚齐 ♡";
  /* 若喜鹊不足 7 只（用户跳过了互动），从两翼直接补齐并入列 */
  var guard=0;
  while(story.magpies.length<NEED && guard++<20){
    spawnMagpie(rand(-40,W+40),rand(-60,-10));
    var m=story.magpies[story.magpies.length-1];
    m.state="toslot"; m.st=0; m.delay=0;
  }
  /* 分配桥位 */
  story.magpies.forEach(function(m,ix){
    m.slot=ix;
    m.sx=m.x; m.sy=m.y;
    m.delay=ix*90;
    m.dur=rand(1200,1500);
    if(m.state!=="slot"){ m.state="toslot"; m.st=0; }
  });
}

/* 滚动监听只做即时补充；真正的状态校准在主循环里每帧进行，事件丢失也能自愈 */
function onScroll(){
  setIdx(clamp(Math.round(window.scrollY/window.innerHeight),0,4));
}
window.addEventListener("scroll",onScroll,{passive:true});

/* ================= 第 3 屏交互：点按唤鹊 ================= */
var s3=document.getElementById("s3");
s3.addEventListener("click",function(e){
  if(story.phase!=="gather") return;
  if(spawnMagpie(e.clientX,e.clientY)){
    story.lastManual=performance.now();
  }
});
/* 长按连唤 */
var holdTimer=null, holdInt=null, holdStart=null;
s3.addEventListener("pointerdown",function(e){
  if(story.phase!=="gather") return;
  holdStart={x:e.clientX,y:e.clientY};
  holdTimer=setTimeout(function(){
    holdInt=setInterval(function(){
      if(story.phase==="gather" && spawnMagpie(rand(W*0.1,W*0.9),rand(H*0.1,H*0.3))){
        story.lastManual=performance.now();
      }
    },420);
  },480);
});
function cancelHold(){ clearTimeout(holdTimer); clearInterval(holdInt); holdInt=null; }
s3.addEventListener("pointerup",cancelHold);
s3.addEventListener("pointercancel",cancelHold);
s3.addEventListener("pointerleave",cancelHold);
s3.addEventListener("pointermove",function(e){
  if(holdStart && Math.abs(e.clientY-holdStart.y)>12) cancelHold();
});
window.addEventListener("scroll",cancelHold,{passive:true});

/* ================= 第 5 屏：天数与七夕 ================= */
(function(){
  var LOVE=new Date(2026,3,28);              /* 在一起：2026-04-28 */
  function daysSince(d){
    var ms=Date.now()-d.getTime();
    return ms<0?0:Math.floor(ms/86400000);
  }
  function daysSinceMD(m,d){                  /* 相识：3月10日，口径同 Tomydearest */
    var n=new Date();
    var t=new Date(n.getFullYear(),m-1,d);
    if(t>n) t=new Date(n.getFullYear()-1,m-1,d);
    return Math.floor((n-t)/86400000);
  }
  document.getElementById("dLove").textContent=daysSince(LOVE);
  document.getElementById("dKnow").textContent=daysSinceMD(3,10);

  var QIXI=[ new Date(2026,7,19), new Date(2027,7,8), new Date(2028,7,26), new Date(2029,7,16) ];
  var today=new Date();
  today.setHours(0,0,0,0);
  var chip=document.getElementById("qixiChip");
  for(var i=0;i<QIXI.length;i++){
    var days=Math.round((QIXI[i]-today)/86400000);
    if(days===0){
      chip.innerHTML="✦ 今天就是七夕 ♡ 去相爱吧";
      return;
    }
    if(days>0){
      document.getElementById("dQixi").textContent=days;
      return;
    }
  }
  chip.style.display="none";
})();

/* ================= 主循环 ================= */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;
  H=window.innerHeight;
  [bgCanvas,fxCanvas].forEach(function(c){
    c.width=Math.floor(W*DPR);
    c.height=Math.floor(H*DPR);
    c.style.width=W+"px";
    c.style.height=H+"px";
  });
  bg.setTransform(DPR,0,0,DPR,0,0);
  fx.setTransform(DPR,0,0,DPR,0,0);
  buildStars();
}
window.addEventListener("resize",resize);
resize();

function slotPoint(i){
  var p=starPos(), c=bridgeCtrl();
  return qPoint(p.l,c,p.r,i/(NEED-1));
}

function updateFx(now,dt){
  var S=story;

  /* 聚鹊阶段：超时自动补齐，保证叙事不断 */
  if(S.phase==="gather" && S.idx===2 && S.magpies.length<NEED){
    if(S.magpies.length===0 && now-(S.lastAuto||0)>1000){
      spawnEdgeMagpie(); S.lastAuto=now;
    } else if(now-S.lastManual>3500 && now-S.lastAuto>1200){
      spawnEdgeMagpie(); S.lastAuto=now;
    }
  }

  /* 喜鹊状态推进 */
  var p=starPos(), ctrl=bridgeCtrl(), c=circleCenter(), R=circleR();
  for(var i=0;i<S.magpies.length;i++){
    var m=S.magpies[i];
    m.flap+=dt*0.012;
    if(m.state==="in"){
      var k=1-Math.pow(0.925,dt/16.7);
      m.x+=(m.tx-m.x)*k;
      m.y+=(m.ty-m.y)*k+Math.sin(m.flap*0.5)*0.5;
      if(Math.hypot(m.tx-m.x,m.ty-m.y)<10){
        m.state="circle";
        m.a=Math.atan2(m.y-c.y,m.x-c.x);
        S.arrived++;
        updateChip();
      }
    } else if(m.state==="circle"){
      m.a+=m.dir*m.spd*dt;
      m.x=c.x+Math.cos(m.a)*R;
      m.y=c.y+Math.sin(m.a)*R+Math.sin(now*0.003+m.bob)*3;
    } else if(m.state==="toslot"){
      m.st+=dt;
      var q=clamp((m.st-m.delay)/m.dur,0,1);
      if(q<=0){
        /* 停留原位（错峰出发） */
      } else {
        var e=easeInOut(q);
        var tp=slotPoint(m.slot);
        if(m.st-m.delay<=dt){ m.sx=m.x; m.sy=m.y; }
        m.x=m.sx+(tp.x-m.sx)*e;
        m.y=m.sy+(tp.y-m.sy)*e;
      }
      if(q>=1) m.state="slot";
    } else if(m.state==="slot"){
      var tp2=slotPoint(m.slot);
      m.x=tp2.x;
      m.y=tp2.y+Math.sin(now*0.004+m.bob)*2.2;
    }
  }

  /* 桥成 → 相会 */
  if(S.phase==="bridge"){
    var allSlot=S.magpies.length>=NEED && S.magpies.every(function(m){ return m.state==="slot"; });
    if(allSlot && now-S.bridgeStart>1200){
      S.phase="meet";
      S.meetStart=now;
    }
  }
  if(S.phase==="meet" && now-S.meetStart>2400+600){
    S.phase="met";
    S.metAt=now;
    burst();
    scenes[3].classList.add("met");
  }

  /* 相会后：星灯缓缓升腾 */
  if(S.phase==="met" && S.idx>=3 && now-S.lastLantern>2600 && S.lanterns.length<16){
    S.lanterns.push(makeLantern(rand(W*0.1,W*0.9),H+20,0));
    S.lastLantern=now;
  }

  /* 星灯运动 */
  for(var j=S.lanterns.length-1;j>=0;j--){
    var l=S.lanterns[j];
    if(l.delay>0){ l.delay-=dt; continue; }
    l.phase+=0.04*(dt/16.7);
    l.x+=l.vx*(dt/16.7);
    l.y+=l.vy*(dt/16.7);
    l.life-=l.decay*(dt/16.7);
    if(l.life<=0||l.y<-80) S.lanterns.splice(j,1);
  }
}

function renderFx(now){
  var S=story;
  var t=now*0.001;

  /* 随第 5 屏进入而淡出互动层 */
  var p5=clamp((window.scrollY-3*H)/H,0,1);
  fxCanvas.style.opacity=(1-p5*0.85).toFixed(3);

  fx.clearRect(0,0,W,H);
  if(S.phase==="idle") return;

  var P=starPos(), ctrl=bridgeCtrl();

  /* 鹊桥金光（有鹊入列后浮现） */
  if(S.phase==="bridge"||S.phase==="meet"||S.phase==="met"){
    var slotN=0;
    S.magpies.forEach(function(m){ if(m.state==="slot") slotN++; });
    var a=clamp(slotN/NEED,0,1)*0.75;
    if(a>0){
      fx.save();
      fx.globalCompositeOperation="lighter";
      var grad=fx.createLinearGradient(P.l.x,P.l.y,P.r.x,P.r.y);
      grad.addColorStop(0,"rgba(255,217,138,0)");
      grad.addColorStop(0.5,"rgba(255,217,138,"+(a*0.85).toFixed(2)+")");
      grad.addColorStop(1,"rgba(255,217,138,0)");
      fx.strokeStyle=grad; fx.lineCap="round";
      fx.lineWidth=7;
      fx.globalAlpha=0.35;
      fx.beginPath(); fx.moveTo(P.l.x,P.l.y);
      fx.quadraticCurveTo(ctrl.x,ctrl.y,P.r.x,P.r.y);
      fx.stroke();
      fx.lineWidth=2.6;
      fx.globalAlpha=1;
      fx.beginPath(); fx.moveTo(P.l.x,P.l.y);
      fx.quadraticCurveTo(ctrl.x,ctrl.y,P.r.x,P.r.y);
      fx.stroke();
      fx.restore();
    }
  }

  /* 双星与星名（搭桥前） */
  if(S.phase==="stars"||S.phase==="gather"||S.phase==="bridge"){
    drawBrightStar(fx,P.l.x,P.l.y,4.4,"#c9dcff",t*1.8);
    drawBrightStar(fx,P.r.x,P.r.y,5.0,"#ffe1a8",t*1.5+2);
    if(S.phase==="stars"||S.phase==="gather"){
      fx.font="15px 'Long Cang','PingFang SC','Microsoft YaHei',sans-serif";
      fx.textAlign="center"; fx.textBaseline="top";
      fx.fillStyle="rgba(170,178,214,.85)";
      fx.fillText("织女星",P.l.x,P.l.y+16);
      fx.fillText("牛郎星",P.r.x,P.r.y+16);
    }
  }

  /* 相会：双星沿桥而行 → 合为一星 */
  if(S.phase==="meet"||S.phase==="met"){
    var q;
    if(S.phase==="meet"){
      q=easeInOut(clamp((now-S.meetStart)/2400,0,1))*0.5;
    } else { q=0.5; }
    var a1=qPoint(P.l,ctrl,P.r,q);
    var a2=qPoint(P.l,ctrl,P.r,1-q);
    if(S.phase==="meet"){
      drawBrightStar(fx,a1.x,a1.y,4.4,"#c9dcff",t*1.8);
      drawBrightStar(fx,a2.x,a2.y,5.0,"#ffe1a8",t*1.5+2);
    } else {
      var M=qPoint(P.l,ctrl,P.r,0.5);
      var pulse=1+0.08*Math.sin(now*0.004);
      drawGlowAt(fx,M.x,M.y,62*pulse,"rgba(255,190,150,0.4)",0.65);
      drawBrightStar(fx,M.x,M.y,5.4*pulse,"#ffd9b0",t*1.6);
      /* 心形光爆：前 4 秒 */
      var hp=(now-S.metAt)/1000;
      if(hp<4){
        var hs=(hp<0.6?easeInOut(hp/0.6):1)*(1+0.06*Math.sin(now*0.006))*(hp>2.6?1-(hp-2.6)/1.4:1);
        drawHeart(fx,M.x,M.y-6,17*hs,"rgba(255,138,180,0.75)",clamp(hs,0,1)*0.8);
      }
    }
    /* 桥端留一点微光 */
    drawGlowAt(fx,P.l.x,P.l.y,26,"rgba(160,190,255,0.35)",0.5);
    drawGlowAt(fx,P.r.x,P.r.y,26,"rgba(255,220,160,0.35)",0.5);
  }

  /* 喜鹊 */
  for(var i=0;i<S.magpies.length;i++){
    var m=S.magpies[i];
    var ang=m.ang||0;
    if(m.state==="circle"){
      ang=m.a+m.dir*Math.PI/2;
    } else if(m.state==="slot"){
      var tan=qTangent(P,ctrl,P.r,m.slot/(NEED-1));
      ang=Math.atan2(tan.y,tan.x)+Math.sin(now*0.003+m.bob)*0.08;
    } else {
      /* in / toslot：按位移估计朝向 */
      if(m.px!==undefined && Math.hypot(m.x-m.px,m.y-m.py)>0.4){
        ang=Math.atan2(m.y-m.py,m.x-m.px);
      }
    }
    m.px=m.x; m.py=m.y;
    m.ang=ang;
    var flap=Math.sin(m.flap*2.2);
    drawMagpie(fx,m.x,m.y,ang,0.92,flap,Math.cos(ang)<-0.15);
  }

  /* 星灯 */
  for(var k=0;k<S.lanterns.length;k++){
    drawLantern(S.lanterns[k],now);
  }
}

var lastT=performance.now();
function loop(now){
  var dt=clamp(now-lastT,0,50);
  lastT=now;
  var t=now*0.001;

  /* 背景 */
  bg.globalCompositeOperation="source-over";
  bg.globalAlpha=1;
  bg.fillStyle="#070818";
  bg.fillRect(0,0,W,H);
  var bgGrad=bg.createRadialGradient(W*0.5,H*0.15,0,W*0.5,H*0.15,Math.max(W,H)*0.9);
  bgGrad.addColorStop(0,"#141a3d");
  bgGrad.addColorStop(1,"#070818");
  bg.fillStyle=bgGrad;
  bg.fillRect(0,0,W,H);
  bg.drawImage(starCanvas,0,0,W,H);
  drawMilkyWay(t);
  drawMeteors();

  /* 互动层 */
  /* 每帧校准当前屏（不依赖 scroll 事件，后台恢复/事件丢失均可自愈） */
  setIdx(clamp(Math.round(window.scrollY/window.innerHeight),0,4));

  updateFx(now,dt);
  renderFx(now);

  requestAnimationFrame(loop);
}

scheduleMeteor();
setIdx(0);
requestAnimationFrame(loop);

/* 字体就绪后无操作：canvas 文字每帧重绘，字体加载完成即自动生效 */
})();
