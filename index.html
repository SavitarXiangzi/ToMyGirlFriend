<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd1e3">
<title>♡ Our Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Long+Cang&display=swap" rel="stylesheet">
<style>
  :root{
    --pink1:#ffeaf4; --pink2:#ffd1e3; --pink3:#f7b8d4; --rose:#ff3d77;
    --ink:#7a2f45; --ink2:#9a4f68;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(120% 80% at 50% -10%, #fff6fb 0%, rgba(255,246,251,0) 60%),
      linear-gradient(160deg, var(--pink1) 0%, var(--pink2) 42%, var(--pink3) 100%);
    background-attachment:fixed;
    font-family:"Ma Shan Zheng","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
  }

  /* ── 极光背景 ── */
  .aurora{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(255,150,200,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(200,150,255,0.12) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 50%, rgba(255,200,220,0.1) 0%, transparent 55%),
      radial-gradient(ellipse at 10% 80%, rgba(150,200,255,0.08) 0%, transparent 40%),
      radial-gradient(ellipse at 90% 20%, rgba(255,200,180,0.1) 0%, transparent 45%);
    animation:auroraMove 25s ease-in-out infinite;
  }
  @keyframes auroraMove{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    25%{ transform:translate(3%,-2%) rotate(1deg); }
    50%{ transform:translate(-2%,3%) rotate(-1deg); }
    75%{ transform:translate(-3%,-2%) rotate(1deg); }
  }

  /* ── 花瓣层 ── */
  .petals-layer{ position:fixed; inset:0; pointer-events:none; z-index:1; }
  .petal{
    position:absolute; top:-8vh; color:#ff8fb1; opacity:0;
    text-shadow:0 0 6px rgba(255,120,170,.4);
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{ transform:translateY(-8vh) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:var(--op,.7); }
    92%{ opacity:var(--op,.7); }
    100%{ transform:translateY(108vh) translateX(var(--drift,30px)) rotate(360deg); opacity:0; }
  }

  /* ── 主舞台 ── */
  .stage{
    position:relative; z-index:3;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top) + 30px) 22px calc(env(safe-area-inset-bottom) + 30px);
    text-align:center;
  }

  /* ── 标题区 ── */
  .header{
    margin-bottom:clamp(28px,6vh,48px);
  }
  .title{
    font-size:clamp(32px,8vw,52px);
    color:var(--rose);
    letter-spacing:.05em;
    margin:0 0 6px;
    text-shadow:0 3px 12px rgba(255,61,119,.2);
    animation:titleFloat 3s ease-in-out infinite;
  }
  @keyframes titleFloat{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-6px); }
  }
  .subtitle{
    font-size:clamp(14px,4vw,18px);
    color:var(--ink2);
    letter-spacing:.1em;
    margin:0;
    opacity:.85;
  }

  /* ── 卡片容器 ── */
  .cards{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:clamp(16px,3vw,28px);
    max-width:800px;
    width:100%;
  }

  /* ── 单张卡片 ── */
  .card{
    width:clamp(260px,42vw,340px);
    background:rgba(255,255,255,.5);
    border:1.5px solid rgba(255,61,119,.2);
    border-radius:20px;
    padding:clamp(22px,4vw,32px) clamp(16px,3vw,24px);
    cursor:pointer;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1),
               box-shadow .3s ease,
               border-color .3s ease,
               background .3s ease;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 0%, rgba(255,61,119,.08) 0%, transparent 70%);
    opacity:0;
    transition:opacity .4s ease;
    border-radius:20px;
  }
  .card:hover{
    transform:translateY(-6px);
    box-shadow:0 12px 32px rgba(255,61,119,.18), 0 4px 10px rgba(255,61,119,.1);
    border-color:rgba(255,61,119,.4);
    background:rgba(255,255,255,.7);
  }
  .card:hover::before{ opacity:1; }
  .card:active{ transform:scale(.97); }

  .card-icon{
    font-size:clamp(38px,8vw,52px);
    position:relative; z-index:1;
    animation:iconBounce 2s ease-in-out infinite;
    filter:drop-shadow(0 3px 8px rgba(255,61,119,.25));
  }
  .card:nth-child(1) .card-icon{ animation-delay:0s; }
  .card:nth-child(2) .card-icon{ animation-delay:.3s; }
  .card:nth-child(3) .card-icon{ animation-delay:.6s; }
  @keyframes iconBounce{
    0%,100%{ transform:translateY(0) scale(1); }
    50%{ transform:translateY(-5px) scale(1.08); }
  }

  .card-label{
    font-size:clamp(18px,5vw,24px);
    color:var(--rose);
    letter-spacing:.06em;
    position:relative; z-index:1;
    font-weight:bold;
  }
  .card-desc{
    font-size:clamp(12px,3.4vw,14px);
    color:var(--ink2);
    letter-spacing:.05em;
    position:relative; z-index:1;
    opacity:.8;
  }
  .card-arrow{
    margin-top:4px;
    font-size:14px;
    color:var(--rose);
    opacity:0;
    transform:translateX(-6px);
    transition:opacity .3s ease, transform .3s ease;
    position:relative; z-index:1;
  }
  .card:hover .card-arrow{
    opacity:1;
    transform:translateX(0);
  }

  /* ── 占位卡片（即将添加） ── */
  .card.placeholder{
    cursor:default;
    opacity:.55;
    border-style:dashed;
    border-color:rgba(255,61,119,.15);
  }
  .card.placeholder:hover{
    transform:none;
    box-shadow:none;
    border-color:rgba(255,61,119,.15);
    background:rgba(255,255,255,.5);
  }
  .card.placeholder:hover::before{ opacity:0; }
  .card.placeholder .card-icon{ animation:none; opacity:.5; }
  .card.placeholder .card-label{ color:var(--ink2); }
  .card.placeholder .card-arrow{ display:none; }

  /* ── 页脚 ── */
  .footer{
    margin-top:clamp(30px,6vh,50px);
    font-size:clamp(12px,3.2vw,14px);
    color:var(--ink2);
    opacity:.6;
    letter-spacing:.08em;
  }
  .footer .heart{
    display:inline-block;
    color:var(--rose);
    animation:beatFoot 1.4s ease-in-out infinite;
  }
  @keyframes beatFoot{
    0%,100%{ transform:scale(1); }
    25%{ transform:scale(1.2); }
    50%{ transform:scale(1); }
  }
</style>
</head>
<body>
  <div class="aurora"></div>
  <div class="petals-layer" id="petals"></div>

  <main class="stage">
    <!-- 标题 -->
    <div class="header">
      <h1 class="title">♡ Our Story ♡</h1>
      <p class="subtitle">每一页，都是关于你的故事</p>
    </div>

    <!-- 卡片列表 -->
    <div class="cards">
      <!-- 卡片 1：Tomydearest -->
      <a class="card" href="Tomydearest.html">
        <div class="card-icon">🦋</div>
        <div class="card-label">To My Dearest</div>
        <div class="card-desc">宇宙山河浪漫，人间点滴温暖</div>
        <div class="card-arrow">点击进入 →</div>
      </a>

      <!-- 占位卡片：后续页面放这里 -->
      <div class="card placeholder">
        <div class="card-icon">✨</div>
        <div class="card-label">即将到来...</div>
        <div class="card-desc">更多故事，敬请期待</div>
      </div>
    </div>

    <!-- 页脚 -->
    <p class="footer">Made with <span class="heart">♡</span> for you</p>
  </main>

<script>
(function(){
  "use strict";

  /* ── 花瓣 ── */
  var petalLayer = document.getElementById("petals");
  var PTYPES = ["♡","❀","✿"];
  for(var i=0;i<14;i++){
    var s = document.createElement("span");
    s.className = "petal";
    s.textContent = PTYPES[i % PTYPES.length];
    s.style.left = (Math.random()*100) + "vw";
    s.style.fontSize = (10 + Math.random()*14) + "px";
    s.style.color = ["#ff8fb1","#ff6f9c","#ffd1e3","#c490ff"][i%4];
    s.style.setProperty("--op", (0.35 + Math.random()*0.4).toFixed(2));
    s.style.setProperty("--drift", ((Math.random()*100-50)|0) + "px");
    s.style.animationDuration = (9 + Math.random()*10) + "s";
    s.style.animationDelay = (-Math.random()*15) + "s";
    petalLayer.appendChild(s);
  }
})();
</script>
</body>
</html>
